<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nordica</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
:root {
    --water: #071426;
    --land: #17304d;
    --land-border: #2b4968;
    --navy: #0b2a4a;
    --route: #1f5d8f;
    --route-active: #6ca6d6;
    --airport: #f4f7fa;
    --hub: #ffffff;
    --text: #f4f7fa;
    --muted: #9eafc0;
    --panel: rgba(8, 22, 39, 0.96);
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--water);
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
    min-height: 600px;
    background: #061525;
}

/* Airport information is shown only in the top-left panel. */

/* Information panel */
#info-panel {
    display: none;
    position: absolute;
    z-index: 1000;
    top: 20px;
    left: 20px;
    width: 330px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.40);
    backdrop-filter: blur(8px);
    overflow: hidden;
}

#panel-header {
    padding: 18px 20px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.eyebrow {
    color: #6ca6d6;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

#airport-name {
    margin: 0;
    font-size: 24px;
}

#airport-code {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

#panel-content {
    padding: 16px 20px 20px;
    max-height: 55vh;
    overflow-y: auto;
}

.empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    margin-bottom: 5px;
}

.section {
    margin-top: 18px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.destination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.destination:last-child {
    border-bottom: none;
}

.destination-code {
    font-weight: 700;
    font-size: 14px;
}

.destination-name {
    color: var(--text);
    font-size: 12px;
    margin-right: 6px;
}

.route-info {
    color: #6ca6d6;
    font-size: 11px;
}

#reset {
    width: 100%;
    margin-top: 17px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: #17304d;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

#reset:hover {
    background: #234a70;
}

/* Airport markers */
.airport-marker {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--airport);
    border: 2px solid #17304d;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
    box-sizing: border-box;
}

.airport-marker.hub {
    width: 15px;
    height: 15px;
    border: 3px solid white;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.12),
                0 2px 9px rgba(0,0,0,0.55);
}

.airport-marker.selected {
    opacity: 1;
}

.airport-marker.fade-out {
    opacity: 0.18;
}

/* Airport labels */
.airport-label {
    color: white;
    background: transparent;
    border: none;
    box-shadow: none;
    font-size: 11px;
    font-weight: 700;
    text-shadow:
        0 1px 3px #071426,
        1px 0 3px #071426,
        -1px 0 3px #071426;
}

.airport-label::before {
    display: none;
}

/* Hover popup */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #0b1d31;
    color: white;
}

.leaflet-popup-content {
    margin: 12px 14px;
}

.popup-title {
    font-size: 16px;
    font-weight: 700;
}

.popup-code {
    color: #6ca6d6;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 2px;
}

.popup-info {
    color: #9eafc0;
    font-size: 12px;
    line-height: 1.45;
    margin-top: 8px;
}

.leaflet-control-attribution {
    background: rgba(7,20,38,.80) !important;
    color: #8fa2b6 !important;
}

.leaflet-control-attribution a {
    color: #9fc6e5 !important;
}

@media (max-width: 600px) {
    #info-panel {
        top: 10px;
        left: 10px;
        width: 285px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

        <div class="eyebrow">Nordica</div>

    </div>

            Hover over an airport to see information about the station.

            Click an airport to highlight all routes to and from that airport.

    minZoom: 2,
    maxZoom: 10
}).setView([55, 10], 4);

/*
   CARTO Dark Matter, label-free basemap.
   CARTO Dark Matter without labels is used here deliberately:
   no API key, no vector-style dependency, no MapLibre dependency.
*/
L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png?key=cb1_2iwu_1_adb61a81e14a92adac6dcc13",
    {
        subdomains: "abcd",
        maxZoom: 20,
        minZoom: 0,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }
).addTo(map);

L.control.zoom({
    position: "bottomright"
}).addTo(map);

/*
   Clicking the background restores the complete Nordica network.
*/
map.on("click", function() {
    resetMap();
});


/* ==========================================================
   ROUTE DRAWING
   ========================================================== */

const routeLayers = [];

routes.forEach(route => {

    const from = airports[route.from];
    const to = airports[route.to];

    if (!from || !to) return;

    const line = L.polyline(
        [
            [from.lat, from.lng],
            [to.lat, to.lng]
        ],
        {
            color: "#4c78a0",
            weight: 2,
            opacity: 0.72,
            smoothFactor: 1
        }
    ).addTo(map);

    line.routeData = route;
    routeLayers.push(line);
});


/* ==========================================================
   AIRPORT MARKERS
   ========================================================== */

const airportMarkers = {};

Object.entries(airports).forEach(([code, airport]) => {

    const markerClass =
        airport.hub
        ? "airport-marker hub"
        : "airport-marker";

    const icon = L.divIcon({
        className: "",
        html: `<div class="airport-marker" id="marker-${code}"></div>`,
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5]
    });

    const marker = L.marker(
        [airport.lat, airport.lng],
        {
            icon: icon,
            title: `${code} · ${airport.name}`
        }
    ).addTo(map);

    airportMarkers[code] = marker;


    /* Airport name appears only while hovering over the dot */
    marker.bindTooltip(
        `${airport.name} (${code})`,
        {
            permanent: false,
            direction: "top",
            offset: [0, -8],
            className: "airport-label",
            sticky: true
        }
    );

    marker.on("mouseover", function() {
        const markerElement = document.getElementById(`marker-${code}`);

        if (markerElement && markerElement.classList.contains("fade-out")) {
            this.closeTooltip();
        }
    });

    /* Popup is click-only */


    marker.on("click", function(e) {
        L.DomEvent.stopPropagation(e);
        selectAirport(code);
    });
});


/* ==========================================================
   CLICK / NETWORK HIGHLIGHT
   ========================================================== */

function selectAirport(code) {

    const airport = airports[code];

    document.getElementById("info-panel").style.display = "block";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    const selectedEl = document.getElementById(`marker-${code}`);
    if (selectedEl) selectedEl.classList.add("selected");

    /*
       Only direct destinations from the selected airport are shown.
       There is no special handling for TOS/BOO/TRD anymore:
       every route is an ordinary direct route.
    */
    const connectedRoutes = routes.filter(route =>
        route.from === code || route.to === code
    );

    const destinationEntries = connectedRoutes.map(route => {

        const destinationCode =
            route.from === code ? route.to : route.from;

        const destination = airports[destinationCode];

        return {
            code: destinationCode,
            airport: destination,
            charter: route.charter || false,
            domestic: destination.country === airport.country
        };
    });

    /*
       Selected airport + its direct destinations stay visible.
       Every other airport fades.
    */
    const visibleAirports = new Set([code]);

    destinationEntries.forEach(entry => {
        visibleAirports.add(entry.code);
    });

    Object.keys(airports).forEach(airportCode => {

        const markerEl =
            document.getElementById(`marker-${airportCode}`);

        if (!markerEl) return;

        if (!visibleAirports.has(airportCode)) {
            markerEl.classList.add("fade-out");

            if (airportMarkers[airportCode]) {
                airportMarkers[airportCode].closeTooltip();
            }
        }
    });

    /*
       Highlight only routes directly connected to the selected airport.
    */
    routeLayers.forEach(line => {

        const route = line.routeData;

        const connected =
            route.from === code ||
            route.to === code;

        line.setStyle({
            color: connected
                ? getComputedStyle(document.documentElement)
                    .getPropertyValue("--route-active").trim()
                : getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
            weight: connected ? 4 : 1,
            opacity: connected ? 1 : 0.10
        });
    });

    /*
       Top-left airport information panel.
       Large = airport name + country.
       Small = IATA / ICAO.
    */
    document.getElementById("airport-name").textContent =
        `${airport.name} · ${airport.country}`;

    document.getElementById("airport-code").textContent =
        `${code} / ${airport.icao}`;

    const badges = [];

    if (airport.hub === "primary") {
        badges.push(`<span class="tag hub">PRIMARY HUB</span>`);
    } else if (airport.hub === "secondary") {
        badges.push(`<span class="tag base">SECONDARY HUB</span>`);
    }

    let panelHTML = badges.join("");

    const nordicaPriority = {
        OSL: 0,
        BGO: 1,
        SVG: 2
    };

    const destinationSort = (a, b) => {

        const aPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, a.code)
                ? nordicaPriority[a.code]
                : 99;

        const bPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, b.code)
                ? nordicaPriority[b.code]
                : 99;

        if (aPriority !== bPriority) {
            return aPriority - bPriority;
        }

        return a.airport.city.localeCompare(b.airport.city);
    };

    const domestic = destinationEntries
        .filter(entry => entry.domestic && !entry.charter)
        .sort(destinationSort);

    const international = destinationEntries
        .filter(entry => !entry.domestic && !entry.charter)
        .sort(destinationSort);

    const charter = destinationEntries
        .filter(entry => entry.charter)
        .sort(destinationSort);

    /*
       Domestic destinations first.
    */
    if (domestic.length) {

        panelHTML += `
            <div class="section">
                Domestic · ${domestic.length}
            </div>
        `;

        domestic.forEach(entry => {

            panelHTML += `
                <div class="destination">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.charter
                                    ? "Charter"
                                    : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       International destinations second.
    */
    if (international.length) {

        panelHTML += `
            <div class="section">
                International · ${international.length}
            </div>
        `;

        international.forEach(entry => {

            panelHTML += `
                <div class="destination">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.charter
                                    ? "Charter"
                                    : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       Charter destinations are listed separately below
       international destinations.
    */
    if (charter.length) {

        panelHTML += `
            <div class="section">
                Charter · ${charter.length}
            </div>
        `;

        charter.forEach(entry => {

            panelHTML += `
                <div class="destination">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        Charter
                    </div>
                </div>
            `;
        });
    }

    panelHTML += `
        <button id="reset-btn" onclick="resetMap()">
            Show entire network
        </button>
    `;

    document.getElementById("panel-content").innerHTML =
        panelHTML;

    map.panTo(
        [airport.lat, airport.lng],
        {
            animate: true,
            duration: 0.5
        }
    );
}

/* ==========================================================
   RESET
   ========================================================== */

function resetMap() {

    document.getElementById("info-panel").style.display = "none";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    routeLayers.forEach(line => {
        line.setStyle({
            color: getComputedStyle(document.documentElement)
                .getPropertyValue("--route").trim(),
            weight: 1.5,
            opacity: 0.45
        });
    });

    document.getElementById("airport-name").textContent =
        "Nordica";

    document.getElementById("airport-code").textContent =
        "OSL / ENGM · Primary Hub";

    document.getElementById("panel-content").innerHTML = `
        <div class="empty-state">
            Hover over an airport to see its name.<br><br>
            Click an airport to see all destinations served from that airport.
        </div>
    `;
}

/* ==========================================================
   INITIAL VIEW
   ========================================================== */

function fitNetwork() {

    const coordinates =
        Object.values(airports).map(airport => [
            airport.lat,
            airport.lng
        ]);

    if (!coordinates.length) return;

    const bounds = L.latLngBounds(coordinates);

    map.fitBounds(bounds, {
        padding: [60, 60],
        maxZoom: 5
    });
}

fitNetwork();

window.resetMap = resetMap;

</script>
</body>
</html>
