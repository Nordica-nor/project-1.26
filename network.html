function isScheduleActiveForDate(schedule, date) {
    if (!schedule || !schedule.startWeek) return true;

    const d = new Date(date);
    const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = utc.getUTCDay() || 7;
    utc.setUTCDate(utc.getUTCDate() + 4 - day);

    const isoYear = utc.getUTCFullYear();
    const yearStart = new Date(Date.UTC(isoYear, 0, 1));
    const isoWeek = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);

    // October-April seasonal routes operate from ISO week 40 of 2026
    // through ISO week 15 of 2027.
    if (isoYear === 2026) return isoWeek >= 40;
    if (isoYear === 2027) return isoWeek <= 15;

    return false;
}

function getScheduleDirectionData(direction) {
    /*
       The schedule tabs are always relative to the route currently shown
       in the route pop-up:
         outbound = pop-up origin -> pop-up destination
         inbound  = pop-up destination -> pop-up origin

       BOO services are stored in two timetable objects:
         TRD-BOO: outbound TRD->BOO, inbound BOO->TRD
         TOS-BOO: outbound TOS->BOO, inbound BOO->TOS

       Handle these four directions explicitly so the two calendar tabs
       can never accidentally use the same timetable.
    */

    if (scheduleRouteFrom === "TRD" && scheduleRouteTo === "BOO") {
        const s = tosThroughLegSchedules["TRD-BOO"];
        return direction === "outbound" ? s.outbound : s.inbound;
    }

    if (scheduleRouteFrom === "BOO" && scheduleRouteTo === "TRD") {
        const s = tosThroughLegSchedules["TRD-BOO"];
        return direction === "outbound" ? s.inbound : s.outbound;
    }

    if (scheduleRouteFrom === "TOS" && scheduleRouteTo === "BOO") {
        const s = tosThroughLegSchedules["TOS-BOO"];
        return direction === "outbound" ? s.outbound : s.inbound;
    }

    if (scheduleRouteFrom === "BOO" && scheduleRouteTo === "TOS") {
        const s = tosThroughLegSchedules["TOS-BOO"];
        return direction === "outbound" ? s.inbound : s.outbound;
    }

    // TOS ↔ TRD through service via Bodø.
    if ((scheduleRouteFrom === "TOS" && scheduleRouteTo === "TRD") ||
        (scheduleRouteFrom === "TRD" && scheduleRouteTo === "TOS")) {
        const s = tosThroughServiceSchedule["TOS-TRD"];

        if (scheduleRouteFrom === "TOS") {
            return direction === "outbound" ? s.outbound : s.inbound;
        }

        return direction === "outbound" ? s.inbound : s.outbound;
    }

    // All other TOS schedules use the existing route timetable.
    const key = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);
    const schedule =
        tosSchedules[key] ||
        additionalSchedules[key] ||
        bgoSchedules[key];
    if (!schedule) return null;
const storedOrigin = key.split("-")[0];
    const sameDirection = scheduleRouteFrom === storedOrigin;

    return direction === "outbound"
        ? (sameDirection ? schedule.outbound : schedule.inbound)
        : (sameDirection ? schedule.inbound : schedule.outbound);
}

function getFlightsForDate(direction, year, month, day) {
    const date = new Date(year, month, day);

    // October-April seasonal routes operate from ISO week 40 of 2026
    // through ISO week 15 of 2027.
    const routeKey = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);
    const seasonalWinterRoutes = new Set([
        "BGO-LPA",
        "BGO-TFS",
        "GOT-TFS",
        "TFS-GOT",
        "SVG-LPA",
        "LPA-SVG",
        "SVG-TFS",
        "TFS-SVG",
        "TRD-LPA",
        "LPA-TRD",
        "LPA-AAL",
        "AAL-LPA",
        "LPA-AES",
        "AES-LPA",
        "LPA-ORB",
        "ORB-LPA",
        "LPA-TRF",
        "TRF-LPA",
        "OSL-LPA",
        "LPA-OSL",
        "OSL-TFS",
        "TFS-OSL",
        "OSL-ACE",
        "ACE-OSL",
        "OSL-HRG",
        "HRG-OSL"
    ]);

    if (seasonalWinterRoutes.has(routeKey) &&
        !isScheduleActiveForDate({ startWeek: 40 }, date)) {
        return [];
    }

    const data = getScheduleDirectionData(direction);
    if (!data) return [];

    const weekdayIndex = (date.getDay() + 6) % 7;
    const weekday = scheduleWeekdayNames[weekdayIndex];

    return data[weekday] || [];
}

function formatScheduleAircraft(aircraft) {
    const value = (aircraft || "").trim().toUpperCase();

    if (value === "CRJ7" || value === "CR7") return "Bombardier CRJ7";
    if (value === "CRJ9") return "Bombardier CRJ9";
    if (value === "B38M") return "Boeing 737-8 MAX";

    return aircraft || "";
}

function splitFlightDetails(flight) {
    const raw = (flight || "").trim();

    // Flight data uses both "/" and "|" as separators in the schedule data.
    // Accept either so every flight number/equipment pair displays correctly.
    const parts = raw.split(/\s*[\/|]\s*/);

    return {
        number: parts[0] || "",
        aircraft: formatScheduleAircraft(parts[1] || "")
    };
}

function getScheduleMonthIndex(year, month) {
    const min = getScheduleMinDate();
    return (year - min.year) * 12 + (month - min.month);
}

function updateScheduleMonthButtons() {
    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        const idx = months.findIndex(m =>
            m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
        );
        const prev = document.querySelector(".schedule-prev-month");
        const next = document.querySelector(".schedule-next-month");
        if (prev) prev.style.visibility = idx > 0 ? "visible" : "hidden";
        if (next) next.style.visibility = idx >= 0 && idx < months.length - 1 ? "visible" : "hidden";
        return;
    }

    const max = getScheduleMaxDate();

    const currentIndex =
        getScheduleMonthIndex(scheduleCalendarYear, scheduleCalendarMonth);

    const maxIndex = getScheduleMonthIndex(max.year, max.month);

    const atFirstMonth = currentIndex <= 0;
    // Two months are displayed, so the first month cannot be the final
    // available month.
    const atLastMonth = currentIndex >= maxIndex - 1;

    document.querySelectorAll(".schedule-prev-month").forEach(button => {
        button.classList.toggle("hidden", atFirstMonth);
    });

    document.querySelectorAll(".schedule-next-month").forEach(button => {
        button.classList.toggle("hidden", atLastMonth);
    });
}


function isSeasonalWinterRoute() {
    const key = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);
    const seasonalWinterRoutes = new Set([
        "BGO-LPA", "LPA-BGO",
        "BGO-TFS", "TFS-BGO",
        "GOT-TFS", "TFS-GOT",
        "SVG-LPA", "LPA-SVG",
        "SVG-TFS", "TFS-SVG",
        "TRD-LPA", "LPA-TRD",
        "LPA-AAL", "AAL-LPA",
        "LPA-AES", "AES-LPA",
        "LPA-ORB", "ORB-LPA",
        "LPA-TRF", "TRF-LPA",
        "OSL-LPA", "LPA-OSL",
        "OSL-TFS", "TFS-OSL",
        "OSL-ACE", "ACE-OSL",
        "OSL-HRG", "HRG-OSL"
    ]);
    return seasonalWinterRoutes.has(key);
}

function getCalendarMonthIndex(year, month) {
    return year * 12 + month;
}

function getSeasonalWinterCalendarMonths() {
    return [
        { year: 2026, month: 9 },  // October
        { year: 2026, month: 10 }, // November
        { year: 2026, month: 11 }, // December
        { year: 2027, month: 0 },  // January
        { year: 2027, month: 1 },  // February
        { year: 2027, month: 2 },  // March
        { year: 2027, month: 3 }   // April
    ];
}

function getScheduleDisplayMonths() {
    if (!isSeasonalWinterRoute()) {
        let nextMonth = scheduleCalendarMonth + 1;
        let nextYear = scheduleCalendarYear;
        if (nextMonth > 11) {
            nextMonth = 0;
            nextYear++;
        }
        return [
            { year: scheduleCalendarYear, month: scheduleCalendarMonth },
            { year: nextYear, month: nextMonth }
        ];
    }

    const months = getSeasonalWinterCalendarMonths();
    const currentIndex = months.findIndex(m =>
        m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
    );
    const idx = currentIndex >= 0 ? currentIndex : 0;

    return [
        months[idx],
        months[idx + 1] || null
    ];
}

function isCharterScheduleFlight(flight) {
    if (!flight) return false;

    if (flight.flightType === "charter") return true;

    const routeKey = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);
    const route = routes.find(r =>
        (r.from === scheduleRouteFrom && r.to === scheduleRouteTo) ||
        (r.from === scheduleRouteTo && r.to === scheduleRouteFrom)
    );

    return route && (route.type === "charter" || route.charter === true);
}

let routeCalendarTooltip = null;

function ensureRouteCalendarTooltip() {
    if (routeCalendarTooltip) return routeCalendarTooltip;

    routeCalendarTooltip = document.createElement("div");
    routeCalendarTooltip.className = "route-calendar-tooltip";
    routeCalendarTooltip.setAttribute("aria-hidden", "true");
    document.body.appendChild(routeCalendarTooltip);

    return routeCalendarTooltip;
}

function hideRouteCalendarTooltip() {
    if (!routeCalendarTooltip) return;
    routeCalendarTooltip.classList.remove("visible");
    routeCalendarTooltip.setAttribute("aria-hidden", "true");
}

function positionRouteCalendarTooltip(dayButton) {
    const tooltip = ensureRouteCalendarTooltip();
    const rect = dayButton.getBoundingClientRect();

    // Prefer directly above the hovered date. If there is not enough room,
    // place it below instead.
    const tooltipHeight = tooltip.offsetHeight || 80;
    const gap = 8;

    let top = rect.top - tooltipHeight - gap;
    if (top < 10) top = rect.bottom + gap;

    let left = rect.left + rect.width / 2 - tooltip.offsetWidth / 2;
    const margin = 10;
    left = Math.max(margin, Math.min(left, window.innerWidth - tooltip.offsetWidth - margin));

    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
}

function showRouteCalendarTooltip(dayButton, year, month, day) {
    const flights = getFlightsForDate("outbound", year, month, day);
    if (!flights.length) return;

    const tooltip = ensureRouteCalendarTooltip();
    tooltip.innerHTML = `
        ${flights.map(flight => {
            const time = (flight.times && flight.times[0]) || "";
            const details = splitFlightDetails(flight.flight);
            const parts = String(time).split(/\s*-\s*/);
            const departure = parts[0] || "";
            const arrival = parts[1] || "";
            return `
                <div class="route-calendar-tooltip-flight">
                    <span class="route-calendar-tooltip-time">${departure} - ${arrival}</span>
                    <span class="route-calendar-tooltip-number">${details.number}</span>
                    <span class="route-calendar-tooltip-aircraft">${details.aircraft}</span>
                </div>
            `;
        }).join("")}
    `;

    tooltip.classList.add("visible");
    tooltip.setAttribute("aria-hidden", "false");
    positionRouteCalendarTooltip(dayButton);
}

function showRouteCalendarLoading() {
    const loading = document.getElementById("route-calendar-loading");
    if (!loading) return;

    loading.classList.add("visible");
    loading.setAttribute("aria-hidden", "false");

    window.clearTimeout(showRouteCalendarLoading._timer);
    showRouteCalendarLoading._timer = window.setTimeout(() => {
        loading.classList.remove("visible");
        loading.setAttribute("aria-hidden", "true");
    }, 650);
}

function initialiseRouteCalendar() {
    // Reset to the first currently relevant month whenever a route is selected.
    const today = getScheduleToday();

    scheduleCalendarYear = today.year;
    scheduleCalendarMonth = today.month;

    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        const current = months.find(m => m.year === today.year && m.month === today.month);

        if (!current && months.length) {
            scheduleCalendarYear = months[0].year;
            scheduleCalendarMonth = months[0].month;
        }
    }

    ensureRouteCalendarTooltip();
    hideRouteCalendarTooltip();
}

function renderRouteCalendar() {
    const monthTitle = document.getElementById("route-calendar-month");
    const grid = document.getElementById("route-calendar-grid");

    if (!monthTitle || !grid || !scheduleRouteFrom || !scheduleRouteTo) return;

    monthTitle.textContent =
        `${scheduleMonthNames[scheduleCalendarMonth]} ${scheduleCalendarYear}`;

    let calendar = scheduleWeekdayNames.map(day =>
        `<div class="route-calendar-weekday">${day.substring(0, 3)}</div>`
    ).join("");

    const firstDay = new Date(scheduleCalendarYear, scheduleCalendarMonth, 1);
    const daysInMonth = new Date(
        scheduleCalendarYear,
        scheduleCalendarMonth + 1,
        0
    ).getDate();
    const firstWeekday = (firstDay.getDay() + 6) % 7;
    const today = getScheduleToday();

    for (let i = 0; i < firstWeekday; i++) {
        calendar += `<div class="route-calendar-day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const flights = getFlightsForDate(
            "outbound",
            scheduleCalendarYear,
            scheduleCalendarMonth,
            day
        );

        const hasFlights = flights.length > 0;
        const isPast =
            scheduleCalendarYear < today.year ||
            (scheduleCalendarYear === today.year &&
             scheduleCalendarMonth === today.month &&
             day < today.day);

        const classes = [
            "route-calendar-day",
            hasFlights ? "has-flights" : "no-flights",
            isPast ? "past-day" : ""
        ].filter(Boolean).join(" ");

        calendar += `
            <button
                type="button"
                class="${classes}"
                ${hasFlights && !isPast
                    ? `onmouseenter="showRouteCalendarTooltip(this, ${scheduleCalendarYear}, ${scheduleCalendarMonth}, ${day})"
                       onmouseleave="hideRouteCalendarTooltip()"
                       onfocus="showRouteCalendarTooltip(this, ${scheduleCalendarYear}, ${scheduleCalendarMonth}, ${day})"
                       onblur="hideRouteCalendarTooltip()"`
                    : ""}
                aria-label="${day} ${scheduleMonthNames[scheduleCalendarMonth]}${hasFlights ? `: ${flights.length} flight${flights.length === 1 ? "" : "s"}` : ": no flights"}"
            >
                <span class="route-calendar-day-number">${day}</span>
                ${hasFlights
                    ? `<span class="route-calendar-day-dots">
                         <span class="route-calendar-flight-dot${flights.some(isCharterScheduleFlight) ? " charter" : ""}"></span>
                       </span>`
                    : ""}
            </button>
        `;
    }

    const totalCells = firstWeekday + daysInMonth;
    const remaining = 42 - totalCells;

    for (let i = 0; i < remaining; i++) {
        calendar += `<div class="route-calendar-day empty"></div>`;
    }

    grid.innerHTML = calendar;
    updateRouteCalendarMonthButtons();
}

function updateRouteCalendarMonthButtons() {
    const prev = document.querySelector(".route-calendar-prev");
    const next = document.querySelector(".route-calendar-next");

    if (!prev || !next) return;

    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        const idx = months.findIndex(m =>
            m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
        );

        prev.classList.toggle("hidden", idx <= 0);
        next.classList.toggle("hidden", idx < 0 || idx >= months.length - 1);
        return;
    }

    const currentIndex =
        getScheduleMonthIndex(scheduleCalendarYear, scheduleCalendarMonth);
    const minIndex = 0;
    const max = getScheduleMaxDate();
    const maxIndex = getScheduleMonthIndex(max.year, max.month);

    prev.classList.toggle("hidden", currentIndex <= minIndex);
    next.classList.toggle("hidden", currentIndex >= maxIndex);
}

function changeRouteCalendarMonth(delta) {
    hideRouteCalendarTooltip();

    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        let idx = months.findIndex(m =>
            m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
        );

        if (idx < 0) idx = 0;

        const nextIndex = idx + delta;
        if (nextIndex < 0 || nextIndex >= months.length) return;

        scheduleCalendarYear = months[nextIndex].year;
        scheduleCalendarMonth = months[nextIndex].month;
    } else {
        let month = scheduleCalendarMonth + delta;
        let year = scheduleCalendarYear;

        if (month < 0) {
            month = 11;
            year--;
        } else if (month > 11) {
            month = 0;
            year++;
        }

        const newIndex = getScheduleMonthIndex(year, month);
        const max = getScheduleMaxDate();
        const maxIndex = getScheduleMonthIndex(max.year, max.month);

        if (newIndex < 0 || newIndex > maxIndex) return;

        scheduleCalendarYear = year;
        scheduleCalendarMonth = month;
    }

    renderRouteCalendar();
}

function renderScheduleDirection(direction) {
    const view = document.getElementById(
        direction === "outbound" ? "schedule-view-outbound" : "schedule-view-inbound"
    );
    if (!view) return;

    const data = getScheduleDirectionData(direction);

    if (!data) {
        view.innerHTML = "";
        return;
    }

    const today = getScheduleToday();

    function renderMonth(year, month) {
        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstWeekday = (firstDay.getDay() + 6) % 7;

        let calendar = `
          <div class="schedule-month-panel">
            <h3 class="schedule-month-title">
              ${scheduleMonthNames[month]} ${year}
            </h3>

            <div class="schedule-calendar-grid">
              ${scheduleWeekdayNames.map(day =>
                  `<div class="schedule-weekday">${day.substring(0, 3)}</div>`
              ).join("")}
        `;

        for (let i = 0; i < firstWeekday; i++) {
            calendar += `<div class="schedule-day empty"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const flights = getFlightsForDate(direction, year, month, day);
            const hasFlights = flights.length > 0;

            const isPast =
                year < today.year ||
                (year === today.year &&
                 month === today.month &&
                 day < today.day);

            const isClickable = hasFlights && !isPast;

            calendar += `
              <button
                class="schedule-day${hasFlights ? " has-flights" : " no-flights"}${isPast ? " past-day" : ""}"
                type="button"
                ${isClickable
                    ? `onclick="openScheduleDay('${direction}', ${year}, ${month}, ${day})"`
                    : ""}
                ${isClickable
                    ? `aria-label="${day} ${scheduleMonthNames[month]}: ${flights.length} flight${flights.length === 1 ? "" : "s"}"`
                    : isPast
                        ? `aria-label="${day} ${scheduleMonthNames[month]}: date has passed" tabindex="-1"`
                        : "tabindex=\"-1\""}
              >
                <span class="schedule-day-number">${day}</span>
                ${
                  hasFlights
                    ? `<span class="schedule-day-dots">
                         ${flights.slice(0, 7).map(flight =>
                             `<span class="schedule-flight-dot${isCharterScheduleFlight(flight) ? " charter" : ""}"></span>`
                         ).join("")}
                       </span>`
                    : ""
                }
              </button>
            `;
        }

        const totalCells = firstWeekday + daysInMonth;
        const remaining = 42 - totalCells;
        for (let i = 0; i < remaining; i++) {
            calendar += `<div class="schedule-day empty"></div>`;
        }

        calendar += `
            </div>
          </div>
        `;

        return calendar;
    }

    const displayMonths = getScheduleDisplayMonths();

    view.innerHTML = `
      <div class="schedule-two-months">
        <div class="schedule-month-panels">
          <button class="schedule-side-arrow schedule-prev-month" type="button"
                  onclick="changeScheduleMonth(-1)" aria-label="Previous month">‹</button>

          ${renderMonth(displayMonths[0].year, displayMonths[0].month)}
          ${displayMonths[1]
              ? renderMonth(displayMonths[1].year, displayMonths[1].month)
              : `<div class="schedule-month-panel schedule-empty-month"></div>`}

          <button class="schedule-side-arrow schedule-next-month" type="button"
                  onclick="changeScheduleMonth(1)" aria-label="Next month">›</button>
        </div>
    <div class="schedule-calendar-legend">
      <span class="schedule-calendar-legend-item">
        <span class="schedule-calendar-legend-dot scheduled"></span>
        Regular flight
      </span>
      <span class="schedule-calendar-legend-item">
        <span class="schedule-calendar-legend-dot charter"></span>
        Charter flight
      </span>
    </div>
    `;
}

function renderBothScheduleCalendars() {
    renderScheduleDirection("outbound");
    renderScheduleDirection("inbound");
    updateScheduleMonthButtons();
}

function changeScheduleMonth(delta) {
    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        let index = months.findIndex(m =>
            m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
        );
        if (index < 0) index = 0;

        const newIndex = index + delta;
        if (newIndex < 0 || newIndex >= months.length) return;

        scheduleCalendarYear = months[newIndex].year;
        scheduleCalendarMonth = months[newIndex].month;
        renderBothScheduleCalendars();
        return;
    }

    let newMonth = scheduleCalendarMonth + delta;
    let newYear = scheduleCalendarYear;

    if (newMonth < 0) {
        newMonth = 11;
        newYear--;
    } else if (newMonth > 11) {
        newMonth = 0;
        newYear++;
    }

    const newIndex = getScheduleMonthIndex(newYear, newMonth);
    const max = getScheduleMaxDate();
    const minIndex = 0;
    const maxIndex = getScheduleMonthIndex(max.year, max.month);

    if (newIndex < minIndex || newIndex > maxIndex) return;

    scheduleCalendarYear = newYear;
    scheduleCalendarMonth = newMonth;
    renderBothScheduleCalendars();
}

function isNordicAirlinkRoute(fromCode, toCode) {
    const key = fromCode + "-" + toCode;
    const reverseKey = toCode + "-" + fromCode;
    const nordicAirlinkRoutes = [
        "TOS-ALF",
        "TOS-KKN",
        "TOS-BOO",
        "TOS-TRD",
        "TRD-BOO",
        "BGO-TRD",
        "BGO-SVG",
        "BGO-AES",
        "BGO-TRF",
        "BGO-TOS",
        "SVG-TRD",
        "TOS-ANX"
    ];
    return nordicAirlinkRoutes.includes(key) || nordicAirlinkRoutes.includes(reverseKey);
}

function openScheduleDay(direction, year, month, day) {
    const flights = getFlightsForDate(direction, year, month, day);
    const modal = document.getElementById("schedule-day-modal");
    const title = document.getElementById("schedule-day-title");
    const list = document.getElementById("schedule-day-flights");

    if (!modal || !title || !list) return;

    const date = new Date(year, month, day);
    const dateText =
        `${scheduleWeekdayNames[(date.getDay() + 6) % 7]}, ` +
        `${day} ${scheduleMonthNames[month]} ${year}`;

    const from = airports[scheduleRouteFrom];
    const to = airports[scheduleRouteTo];

    const directionFrom = direction === "outbound" ? from : to;
    const directionTo = direction === "outbound" ? to : from;

    title.textContent = dateText;

    if (!flights.length) {
        list.innerHTML = `<div class="daily-no-flights">No flights scheduled for this day.</div>`;
    } else {
        list.innerHTML = flights.map(flight => {
            const details = splitFlightDetails(flight.flight);

            return `
              <div class="daily-flight">
                <div>
                  <div class="daily-flight-times">
                    ${flight.times.join("<br>")}
                  </div>
                  <div class="daily-flight-info">
                    ${flight.via || (directionFrom.name + " → " + directionTo.name)}

                  </div>
                </div>
                <div>
                  <div class="schedule-flight-number">
                    Flight ${details.number}
                  </div>
                  <div class="schedule-aircraft-type">
                    ${details.aircraft}
                    ${
                        isNordicAirlinkRoute(scheduleRouteFrom, scheduleRouteTo)
                        ? `<div class="daily-flight-operator">Nordic Airlink</div>`
                        : ""
                    }
                  </div>
                </div>
              </div>
            `;
        }).join("");
    }

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
}

function closeScheduleDay() {
    const modal = document.getElementById("schedule-day-modal");
    if (!modal) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
}

function updateScheduleRouteTabs() {
    const outboundTab = document.getElementById("schedule-tab-outbound");
    const inboundTab = document.getElementById("schedule-tab-inbound");
    if (!outboundTab || !inboundTab || !scheduleRouteFrom || !scheduleRouteTo) return;

    const from = airports[scheduleRouteFrom];
    const to = airports[scheduleRouteTo];
    if (!from || !to) return;

    outboundTab.textContent = `${from.name} ${scheduleRouteFrom} → ${to.name} ${scheduleRouteTo}`;
    inboundTab.textContent = `${to.name} ${scheduleRouteTo} → ${from.name} ${scheduleRouteFrom}`;

    renderScheduleDirection("outbound");
    renderScheduleDirection("inbound");
}



function switchScheduleTab(direction) {
    const outbound = direction === "outbound";
    document.getElementById("schedule-tab-outbound").classList.toggle("active", outbound);
    document.getElementById("schedule-tab-inbound").classList.toggle("active", !outbound);
    document.getElementById("schedule-tab-outbound").setAttribute("aria-selected", outbound);
    document.getElementById("schedule-tab-inbound").setAttribute("aria-selected", !outbound);
    document.getElementById("schedule-view-outbound").classList.toggle("active", outbound);
    document.getElementById("schedule-view-inbound").classList.toggle("active", !outbound);

    const today = getScheduleToday();
    scheduleCalendarYear = today.year;
    scheduleCalendarMonth = today.month;

    if (isSeasonalWinterRoute()) {
        const seasonalMonths = getSeasonalWinterCalendarMonths();
        if (seasonalMonths.length) {
            scheduleCalendarYear = seasonalMonths[0].year;
            scheduleCalendarMonth = seasonalMonths[0].month;
        }
    }


    renderScheduleDirection(direction);
}

function openScheduleModal() {
    const today = getScheduleToday();
    scheduleCalendarYear = today.year;
    scheduleCalendarMonth = today.month;

    if (isSeasonalWinterRoute()) {
        const seasonalMonths = getSeasonalWinterCalendarMonths();
        const firstMonth = seasonalMonths[0];
        const currentSeasonalMonth = seasonalMonths.find(m =>
            m.year === today.year && m.month === today.month
        );
        if (!currentSeasonalMonth) {
            scheduleCalendarYear = firstMonth.year;
            scheduleCalendarMonth = firstMonth.month;
        }
    }
    updateScheduleRouteTabs();
    const modal = document.getElementById("schedule-modal");
    if (!modal) return;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
}

function closeScheduleModal() {
    const modal = document.getElementById("schedule-modal");
    if (!modal) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
}
