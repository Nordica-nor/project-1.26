<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nordica — Network</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
:root {
    --water: #071426;
    --land: #17304d;
    --land-border: #2b4968;
    --navy: #0b2a4a;
    --route: #1f5d8f;
    --route-active: #6ca6d6;
    --airport: #f4f7fa;
    --hub: #ffffff;
    --text: #f4f7fa;
    --muted: #9eafc0;
    --panel: rgba(8, 22, 39, 0.96);
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--water);
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: calc(100% - 76px);
    min-height: 0;
    background: #061525;
}

/* Airport information is shown only in the top-left panel. */

/* Information panel */
#info-panel {
    display: none;
    position: absolute;
    z-index: 1000;
    top: 96px;
    left: 20px;
    width: 390px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.40);
    backdrop-filter: blur(8px);
    overflow: hidden;
}

#panel-header {
    padding: 18px 20px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.eyebrow {
    color: #6ca6d6;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

#airport-name {
    margin: 0;
    font-size: 24px;
}

#airport-code {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

#airport-code strong {
    color: var(--text);
    font-weight: 700;
}

#panel-content {
    padding: 16px 20px 20px;
    max-height: 55vh;
    overflow-y: auto;
}

.empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    margin-bottom: 5px;
}


.airport-role {
    margin-top: 8px;
}

.airport-tabs {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    margin-top: 14px;
    height: 42px;
    padding: 0;
    border-bottom: 1px solid 

rgba(255,255,255,.10);
}

.airport-tab {
    position: relative;
    flex: 1 1 33.333%;
    height: 42px;
    min-width: 0;
    padding: 0 8px;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 9px 9px 0 0;
    background: transparent;
    color: rgba(255,255,255,.55);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.airport-tab:hover {
    color: #fff;
    background: rgba(255,255,255,.045);
}

.airport-tab.active {
    border-color: rgba(255,255,255,.10);
    background: #1d2530;
    color: #fff;
}

.airport-tab.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    background: #6ca6d6;
    border-radius: 2px;
}

.airport-schedule-title {
    margin: 0 0 12px;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
}

.airport-schedule-list {
    width: 100%;
}

.airport-schedule-flight {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.airport-schedule-flight:last-child {
    border-bottom: none;
}

.airport-schedule-iata {
    margin-left: 5px;
    color: rgba(255,255,255,.66);
    font-size: 13px;
    font-weight: 600;
}

.airport-schedule-route {
    color: var(--text);
    font-size: 16px;
    line-height: 1.05;
}

.airport-schedule-time {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    justify-self: end;
}

.airport-schedule-secondary-time {
    margin-top: 0;
    color: rgba(255,255,255,.66);
    font-size: 11px !important;
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    text-align: right;
}


.airport-schedule-meta {
    margin-top: 3px;
    color: rgba(255,255,255,.60);
    font-size: 11px;
    line-height: 1.35;
}

.airport-schedule-number {
    color: rgba(255,255,255,.72);
    font-weight: 700;
}

.airport-schedule-empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

@media (max-width: 700px) {
    #map { height: calc(100% - 68px); }

    .airport-tab {
        font-size: 11px;
        padding: 0 4px;
    }
}

.section {
    margin-top: 18px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.destination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.destination:last-child {
    border-bottom: none;
}

.destination-code {
    font-weight: 700;
    font-size: 14px;
}

.destination-name {
    color: var(--text);
    font-size: 12px;
    margin-right: 6px;
}

.route-info {
    color: #6ca6d6;
    font-size: 11px;
}

#reset {
    width: 100%;
    margin-top: 17px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: #17304d;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

#reset:hover {
    background: #234a70;
}

/* Airport markers */
.airport-marker {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--airport);
    border: 2px solid #17304d;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
    box-sizing: border-box;
}

.airport-marker.filter-hidden {
    opacity: 0 !important;
    pointer-events: none !important;
}

.airport-marker.hub {
    width: 11px;
    height: 11px;
    border: 2px solid #17304d;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
}

.airport-marker.selected {
    opacity: 1;
}

.airport-marker.fade-out {
    opacity: 0.18;
}

/* Airport labels */
.airport-label {
    color: white;
    background: transparent;
    border: none;
    box-shadow: none;
    font-size: 11px;
    font-weight: 700;
    text-shadow:
        0 1px 3px #071426,
        1px 0 3px #071426,
        -1px 0 3px #071426;
}

.airport-label::before {
    display: none;
}

/* Hover popup */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #0b1d31;
    color: white;
}

.leaflet-popup-content {
    margin: 12px 14px;
}

.popup-title {
    font-size: 16px;
    font-weight: 700;
}

.popup-code {
    color: #6ca6d6;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 0;
}

.popup-info {
    color: #9eafc0;
    font-size: 12px;
    line-height: 1.45;
    margin-top: 8px;
}

.leaflet-control-attribution {
    background: rgba(7,20,38,.80) !important;
    color: #8fa2b6 !important;
}

.leaflet-control-attribution a {
    color: #9fc6e5 !important;
}

@media (max-width: 600px) {
    #info-panel {
        top: 10px;
        left: 10px;
        width: 285px;
    }
}

.route-detail {
    padding-top: 2px;
}

.route-detail-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--muted);
    font-size: 12px;
}

.route-detail-row strong {
    color: var(--text);
    font-size: 15px;
    text-align: right;
    line-height: 1.35;
    max-width: 65%;
}

.route-detail-row.seasonal-row strong {
    color: var(--text);
}


.destination.clickable {
    cursor: pointer;
    margin-left: -8px;
    margin-right: -8px;
    padding-left: 8px;
    padding-right: 8px;
    border-radius: 6px;
}
.destination.clickable:hover {
    background: rgba(255,255,255,0.04);
}


#panel-header {
    position: relative;
}

#panel-switch {
    display: none;
    position: absolute;
    top: 76px;
    right: 9px;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    color: rgba(255,255,255,.78);
    font-size: 25px;
    line-height: 32px;
    cursor: pointer;
    z-index: 20;
}
#info-panel.route-no-season:not(.route-starts-april) #panel-switch {
    top: 58px;
}
#info-panel.route-starts-april #panel-switch {
    top: 58px;
}
#info-panel:not(.route-no-season) #panel-switch {
    top: 58px;
}
#panel-switch.switching {
    transform: rotate(180deg) scale(.94);
    background: rgba(255,255,255,.10);
    border-color: rgba(255,255,255,.34);
    transition: transform .32s ease, background .18s ease, border-color .18s ease;
}
#panel-switch:hover {
    background: transparent;
    color: #fff;
}

#panel-close {
    position: absolute;
    top: 10px;
    right: 11px;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: rgba(244,247,250,0.52);
    font-size: 22px;
    font-weight: 300;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    border-radius: 50%;
    transition: color 0.15s ease, background 0.15s ease;
}

#panel-close:hover {
    color: rgba(244,247,250,0.90);
    background: rgba(255,255,255,0.07);
}

#panel-close:focus-visible {
    outline: 1px solid rgba(108,166,214,0.75);
    outline-offset: 2px;
}


.operator-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.operator-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.operator-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.operator-info .operator-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: 50%;
    right: auto;
    transform: translate(-50%, 3px);
    width: 250px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.operator-info .operator-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.operator-info:hover .operator-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}


#network-filters {
    position: absolute;
    z-index: 1100;
    top: 94px;
    right: 18px;
    display: flex;
    gap: 1px;
    align-items: center;
}

.filter-button {
    appearance: none;
    padding: 8px 13px;
    min-width: 92px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    background: rgba(18,24,32,0.88);
    color: rgba(255,255,255,0.82);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.35px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
}

.filter-button:hover {
    background: rgba(31,42,54,0.94);
    border-color: rgba(120,190,255,0.42);
    color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.34), 0 0 12px rgba(100,180,255,0.08), inset 0 1px 0 rgba(255,255,255,0.07);
    transform: translateY(-1px);
}

.filter-button:active {
    transform: translateY(0);
}

.filter-button.active {
    background: linear-gradient(180deg, rgba(72,139,190,0.92), rgba(48,105,151,0.94));
    border-color: rgba(151,216,255,0.72);
    color: #fff;
    box-shadow: 0 5px 16px rgba(0,0,0,0.32), 0 0 14px rgba(80,170,235,0.16), inset 0 1px 0 rgba(255,255,255,0.16);
}

.filter-button.active:hover {
    background: linear-gradient(180deg, rgba(82,151,203,0.96), rgba(54,115,163,0.98));
    border-color: rgba(177,225,255,0.82);
}

.filter-button:focus-visible {
    outline: none;
    border-color: rgba(151,216,255,0.9);
    box-shadow: 0 0 0 2px rgba(90,170,225,0.22), 0 5px 16px rgba(0,0,0,0.32);
}

@media (max-width: 600px) {
    #network-filters {
        top: 78px;
        right: 10px;
        gap: 5px;
    }

    .filter-button {
        min-width: 0;
        padding: 7px 9px;
        font-size: 10px;
    }
}


.frequency-value {
    white-space: nowrap;
    font-size: 13px !important;
}

.flight-type-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 7px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.flight-type-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.flight-type-info .flight-type-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: auto;
    right: -6px;
    width: 270px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.flight-type-info .flight-type-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    right: 2px;
    left: auto;
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.flight-type-info:hover .flight-type-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(0, 0);
}


.airport-marker.special-base {
    position: relative;
}

.airport-marker.special-base::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #d62828;
}


.via-bodo {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
}

/* Route Schedule */
/* Embedded route calendar */
.route-popup-comments {
    margin-top: 8px;
    color: rgba(255,255,255,.52);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.35;
    text-align: center;
}
.route-calendar.schedule-transition-out {
    opacity: .32;
    transform: translateX(-7px);
    transition: opacity .18s ease, transform .18s ease;
}
.route-calendar.schedule-transition-in {
    opacity: 0;
    transform: translateX(7px);
    transition: opacity .26s ease, transform .26s ease;
}
.route-calendar {
    width: 100%;
    box-sizing: border-box;
    margin-top: -8px;
    padding-top: 2px;
    position: relative;
}

.route-calendar-loading {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 4px;
    color: rgba(255,255,255,.52);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-3px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s ease;
}

.route-calendar-loading.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.route-calendar-spinner {
    width: 11px;
    height: 11px;
    border: 2px solid rgba(255,255,255,.18);
    border-top-color: rgba(112,194,241,.95);
    border-radius: 50%;
    animation: routeCalendarSpin .65s linear infinite;
}

@keyframes routeCalendarSpin {
    to { transform: rotate(360deg); }
}

.route-calendar-header {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.route-calendar-month {
    margin: 0;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
}

.route-calendar-arrow {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.82);
    font-size: 20px;
    line-height: 28px;
    cursor: pointer;
    transition: .16s ease;
}

.route-calendar-arrow:hover {
    background: rgba(92,158,204,.20);
    border-color: rgba(130,205,250,.42);
    color: #fff;
}

.route-calendar-arrow.hidden {
    visibility: hidden;
    pointer-events: none;
}

.route-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: 28px repeat(6, 42px);
    border-top: 1px solid rgba(255,255,255,.09);
    border-left: 1px solid rgba(255,255,255,.09);
    border-radius: 8px;
    overflow: hidden;
}

.route-calendar-weekday {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15,20,27,.72);
    color: rgba(255,255,255,.54);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .25px;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
}

.route-calendar-day {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 7px 8px;
    border: 0;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
    background: rgba(29,37,48,.72);
    color: rgba(255,255,255,.82);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    text-align: left;
    cursor: default;
    transition: background .14s ease, box-shadow .14s ease;
}

.route-calendar-day.empty {
    background: rgba(18,24,32,.42);
}

.route-calendar-day.has-flights {
    cursor: pointer;
    z-index: 1;
}

.route-calendar-day.has-flights > * {
    pointer-events: none;
}

.route-calendar-day.has-flights:hover {
    z-index: 2;
    background: rgba(65,116,151,.28);
    box-shadow: inset 0 0 0 1px rgba(111,192,239,.20);
}

.route-calendar-day.no-flights {
    position: relative;
    background: rgba(18,24,32,.42);
    color: rgba(255,255,255,.72);
    opacity: .62;
    overflow: hidden;
}

.route-calendar-day.no-flights::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,.055) 0,
        rgba(255,255,255,.055) 1px,
        transparent 1px,
        transparent 8px
    );
}

.route-calendar-day.past-day {
    background: rgba(15,20,27,.42);
    color: rgba(255,255,255,.28);
    opacity: .40;
    cursor: default;
}

.route-calendar-day.past-day.no-flights::after {
    display: none;
}

<style id="nordica-network-frame-v141">
/*
  V1.0.141
  The large navy strip at the bottom was not a frame; it was the unused
  76px of page height created by #map's calc(100% - 76px).
  Let the map occupy the entire viewport. The fixed header naturally covers
  its top portion, while the frame is drawn over the map itself.
*/
#map {
    height: 100% !important;
    width: 100% !important;
    border: 0 !important;
    box-sizing: border-box !important;
    position: relative !important;
}

/* Thin, visible side + bottom frame, above all Leaflet layers. */
#map::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    box-sizing: border-box;
    border-left: 3px solid rgba(255,255,255,0.12);
    border-right: 3px solid rgba(255,255,255,0.12);
    border-bottom: 3px solid rgba(255,255,255,0.12);
}

@media (max-width: 700px) {

        height: 100% !important;

        border-right-width: 3px;

}

/*
   Build a great-circle arc between two airports.
   This makes long-haul routes follow the curvature of the Earth instead
   of appearing as straight lines on the flat map.
*/
function greatCirclePoints(from, to, segments = 48) {

    const lat1 = from.lat * Math.PI / 180;
    const lon1 = from.lng * Math.PI / 180;
    const lat2 = to.lat * Math.PI / 180;
    const lon2 = to.lng * Math.PI / 180;

    const x1 = Math.cos(lat1) * Math.cos(lon1);
    const y1 = Math.cos(lat1) * Math.sin(lon1);
    const z1 = Math.sin(lat1);

    const x2 = Math.cos(lat2) * Math.cos(lon2);
    const y2 = Math.cos(lat2) * Math.sin(lon2);
    const z2 = Math.sin(lat2);

    let dot = x1 * x2 + y1 * y2 + z1 * z2;
    dot = Math.max(-1, Math.min(1, dot));

    const angle = Math.acos(dot);

    // Identical / extremely close points.
    if (angle < 0.000001) {
        return [
            [from.lat, from.lng],
            [to.lat, to.lng]
        ];
    }

    const sinAngle = Math.sin(angle);
    const points = [];

    for (let i = 0; i <= segments; i++) {

        const t = i / segments;

        const a = Math.sin((1 - t) * angle) / sinAngle;
        const b = Math.sin(t * angle) / sinAngle;

        const x = a * x1 + b * x2;
        const y = a * y1 + b * y2;
        const z = a * z1 + b * z2;

        const lat = Math.atan2(z, Math.sqrt(x * x + y * y));
        const lon = Math.atan2(y, x);

        points.push([
            lat * 180 / Math.PI,
            lon * 180 / Math.PI
        ]);
    }

    return points;
}

const routeLayers = [];

routes.forEach(route => {

    if (!from || !to) return;

        {

            weight: 2,
            opacity: 0.72,
            smoothFactor: 1
        }
    ).addTo(map);

    line.routeData = route;
    routeLayers.push(line);
});

        if (selectedRouteKey) {
            const currentRoute = routes.find(route =>
                `${route.from}-${route.to}` === selectedRouteKey ||
                `${route.to}-${route.from}` === selectedRouteKey
            );

            if (
                currentRoute &&
                (currentRoute.from === code || currentRoute.to === code)
            ) {
                selectAirport(code);
                return;
            }
        }

        // From an airport-network view, clicking a connected destination
        // enters the single-route view.
        if (
            selectedAirportCode &&
            selectedAirportCode !== code &&
            routes.some(route =>
                (route.from === selectedAirportCode && route.to === code) ||
                (route.to === selectedAirportCode && route.from === code)
            )
        ) {
            selectRoute(selectedAirportCode, code);
        } else {
            selectAirport(code);
        }
    });
});

function selectRoute(originCode, destinationCode) {

    const route = routes.find(r =>
        (r.from === originCode && r.to === destinationCode) ||
        (r.from === destinationCode && r.to === originCode)
    );

    if (!route) return;

    // Selecting a specific route exits any active Domestic/International/Charter
    // filter so the chosen route can always be displayed.
    Object.keys(activeFilters).forEach(key => {
        activeFilters[key] = false;
    });

    document.querySelectorAll(".filter-button").forEach(button => {
        button.classList.remove("active");
    });

    selectedRouteKey = `${route.from}-${route.to}`;

    const panelSwitch = document.getElementById("panel-switch");
    if (panelSwitch) panelSwitch.style.display = "flex";

    const airportTabs = document.getElementById("airport-tabs");
    if (airportTabs) airportTabs.style.display = "none";
    scheduleRouteFrom = originCode;
    scheduleRouteTo = destinationCode;
    updateFilterVisibility();

    const origin = airports[originCode];
    const destination = airports[destinationCode];

    document.getElementById("info-panel").style.display = "block";

    /*
       Only the two airports and this one route remain fully visible.
       Everything else fades.
    */
    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    const originEl = document.getElementById(`marker-${originCode}`);
    const destinationEl = document.getElementById(`marker-${destinationCode}`);

    if (originEl) originEl.classList.add("selected");
    if (destinationEl) destinationEl.classList.add("selected");

    Object.keys(airports).forEach(code => {
        if (code !== originCode && code !== destinationCode) {
            const el = document.getElementById(`marker-${code}`);
            if (el) {
                el.classList.add("fade-out");
                if (airportMarkers[code]) {
                    airportMarkers[code].closeTooltip();
                }
            }
        }
    });

    routeLayers.forEach(line => {

        const r = line.routeData;

        const isSelected =
            (r.from === originCode && r.to === destinationCode) ||
            (r.from === destinationCode && r.to === originCode);

        line.setStyle({
            color: isSelected
                ? getComputedStyle(document.documentElement)
                    .getPropertyValue("--route-active").trim()
                : getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
            weight: isSelected ? 5 : 1,
            opacity: isSelected ? 1 : 0.08
        });
    });

    const routeOriginName = originCode === "LPA" ? "Gran Canaria" : origin.name;
    const routeDestinationName = destinationCode === "LPA" ? "Gran Canaria" : destination.name;

    document.getElementById("airport-name").innerHTML =
        `${routeOriginName} ${originCode} -<br>${routeDestinationName} ${destinationCode}`;

    // Route pop-ups must not carry over the role/crew-base label
    // from the previously selected airport.
    const roleEl = document.getElementById("airport-role");
    if (roleEl) roleEl.innerHTML = "";

    const nordicAirlinkRoutes = new Set([
        ["TOS","ALF"], ["TOS","KKN"], ["TOS","BOO"], ["TOS","TRD"],
        ["TRD","BOO"], ["BGO","TRD"], ["BGO","SVG"], ["BGO","AES"], ["BGO","TRF"], ["BGO","TOS"], ["SVG","TRD"], ["TOS","ANX"]
    ].map(([from, to]) => [from, to].sort().join("-")));

    const routePair = [originCode, destinationCode].sort().join("-");
    const isNordicAirlink = nordicAirlinkRoutes.has(routePair);

    const outboundSchedule = getScheduleDirectionData("outbound");
    const inboundSchedule = getScheduleDirectionData("inbound");
    const hasAnySchedule = outboundSchedule || inboundSchedule;

    const routeComments = [];
    if (isNordicAirlink) {
        routeComments.push(`<span class="operator-label">Operated by <strong>Nordic Airlink</strong><span class="operator-info">?<span class="operator-tooltip">Routes operated by Nordic Airlink primarily serve commuters and may offer a reduced onboard serving</span></span></span>`);
    }

    if (isSeasonalWinterRoute()) {
        routeComments.push("Operating from October to April");
        document.getElementById("info-panel").classList.remove("route-no-season", "route-starts-april");
    } else if (!hasAnySchedule) {
        routeComments.push("Starts in April");
        document.getElementById("info-panel").classList.add("route-no-season", "route-starts-april");
    } else {
        document.getElementById("info-panel").classList.remove("route-no-season", "route-starts-april");
    }

    document.getElementById("airport-code").innerHTML = "";

    let routeHTML = `
        <div class="route-calendar" id="route-calendar">
            <div class="route-calendar-header">
                <button class="route-calendar-arrow route-calendar-prev" type="button"
                        onclick="changeRouteCalendarMonth(-1)" aria-label="Previous month">‹</button>
                <h3 class="route-calendar-month" id="route-calendar-month"></h3>
                <button class="route-calendar-arrow route-calendar-next" type="button"
                        onclick="changeRouteCalendarMonth(1)" aria-label="Next month">›</button>
            </div>

            <div class="route-calendar-grid" id="route-calendar-grid"></div>
        </div>

        <div class="route-popup-comments" id="route-popup-comments"></div>
    `;

    document.getElementById("panel-content").innerHTML = routeHTML;

    const routeCommentsEl = document.getElementById("route-popup-comments");
    if (routeCommentsEl) {
        routeCommentsEl.innerHTML = routeComments.join("<br>");
        routeCommentsEl.style.display = routeComments.length ? "block" : "none";
    }

    initialiseRouteCalendar();
    renderRouteCalendar();
    applyNetworkFilters();

    /*
       Keep the two selected airports centered without changing the
       existing zoom style too aggressively.
    */
    const bounds = L.latLngBounds(
        [origin.lat, origin.lng],
        [destination.lat, destination.lng]
    );

    map.fitBounds(bounds, {
        padding: [120, 120],
        maxZoom: 6,
        animate: true,
        duration: 0.5
    });
}

function getAirportTodaySchedule(code, dayOffset = 0) {
    const scheduleLookupDate = new Date();
    scheduleLookupDate.setDate(scheduleLookupDate.getDate() + dayOffset);
    const today = getScheduleToday();
    const date = new Date(Date.UTC(today.year, today.month, today.day + dayOffset));
    const weekday = scheduleWeekdayNames[(date.getUTCDay() + 6) % 7];

    const departures = [];
    const arrivals = [];

    const addFlight = (originCode, destinationCode, flight, timeRange, via) => {
        const parts = String(timeRange || "").split(/\s*-\s*/);
        const departureTime = parts[0] || "";
        const arrivalTime = parts[1] || "";

        const details = splitFlightDetails(flight);

        if (originCode === code) {
            departures.push({
                time: departureTime,
                endTime: arrivalTime,
                originCode,
                destinationCode,
                flight: details.number,
                aircraft: details.aircraft,
                via: via || ""
            });
        }

        if (destinationCode === code) {
            arrivals.push({
                time: arrivalTime,
                startTime: departureTime,
                originCode,
                destinationCode,
                flight: details.number,
                aircraft: details.aircraft,
                via: via || ""
            });
        }
    };

    // Standard TOS schedules. TOS-TRD is handled by the through-service
    // timetable below so that TOS/TRD do not receive duplicate flights.
    Object.entries(tosSchedules).forEach(([key, schedule]) => {
        if (key === "TOS-TRD") return;

        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time));
        });
    });

    // Additional schedules from KRS, TRD and SVG schedule documents.
    Object.entries(additionalSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time));
        });
    });

    // BGO schedule document. All flights are assumed year-round.
    Object.entries(bgoSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time));
        });
    });

    // Through-service TOS ↔ TRD. At TOS and TRD the published schedule
    // represents the complete journey; at BOO the individual leg schedule
    // is used below.
    const through = tosThroughServiceSchedule["TOS-TRD"];
    if (through) {
        (through.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time =>
                addFlight("TOS", "TRD", flight.flight, time, flight.via)
            );
        });

        (through.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time =>
                addFlight("TRD", "TOS", flight.flight, time, flight.via)
            );
        });
    }

    // Individual Bodø legs. These are used for BOO and also provide the
    // actual operating leg schedule at the intermediate airport.
    Object.entries(tosThroughLegSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time));
        });
    });

    // Remove duplicate leg entries at TOS/TRD because those are already
    // represented by the through-service timetable above.
    const dedupe = flights => {
        const seen = new Set();
        return flights.filter(f => {
            const key = [
                f.time, f.endTime, f.startTime,
                f.originCode, f.destinationCode, f.flight
            ].join("|");

            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    };

    // TOS-TRD is a through-service via Bodø. It should therefore not
    // appear as a direct TOS↔TRD departure/arrival on either airport board.
    const filteredDepartures = departures.filter(flight =>
        !(
            (code === "TOS" && flight.destinationCode === "TRD") ||
            (code === "TRD" && flight.destinationCode === "TOS")
        )
    );

    const filteredArrivals = arrivals.filter(flight =>
        !(
            (code === "TOS" && flight.originCode === "TRD") ||
            (code === "TRD" && flight.originCode === "TOS")
        )
    );

    return {
        departures: dedupe(filteredDepartures).sort((a, b) =>
            a.time.localeCompare(b.time)
        ),
        arrivals: dedupe(filteredArrivals).sort((a, b) =>
            a.time.localeCompare(b.time)
        )
    };
}

function renderAirportScheduleTab(code, tab) {
    const content = document.getElementById("panel-content");
    if (!content) return;

    if (tab === "destinations") {
        renderAirportDestinations(code);
        return;
    }

    const todaySchedule = getAirportTodaySchedule(code, 0);
    const tomorrowSchedule = getAirportTodaySchedule(code, 1);

    const todayFlights = todaySchedule[tab] || [];
    const tomorrowFlights = tomorrowSchedule[tab] || [];

    const todayTitle = tab === "departures"
        ? "Departures today"
        : "Arrivals today";

    const tomorrowTitle = tab === "departures"
        ? "Departures tomorrow"
        : "Arrivals tomorrow";

    function renderFlightList(flights) {
        if (!flights.length) {
            return `<div class="airport-schedule-empty">No scheduled flights.</div>`;
        }

        let html = `<div class="airport-schedule-list">`;

        flights.forEach(flight => {
            const otherCode =
                tab === "departures" ? flight.destinationCode : flight.originCode;
            const otherAirport = airports[otherCode];

            const routeText =
                `${otherAirport.name} <span class="airport-schedule-iata">(${otherCode})</span>`;

            const operator =
                isNordicAirlinkRoute(flight.originCode, flight.destinationCode)
                    ? `<div class="airport-schedule-meta">Nordic Airlink</div>`
                    : "";

            html += `
                <div class="airport-schedule-flight">
                    <div>
                        <div class="airport-schedule-route">${routeText}</div>
                        <div class="airport-schedule-meta">
                            <span class="airport-schedule-number">Flight ${flight.flight}</span>
                            · ${flight.aircraft}
                        </div>
                        ${operator}
                    </div>
                    <div>
                        <div class="airport-schedule-time">
                            ${flight.time}
                        </div>
                        <div class="airport-schedule-secondary-time">
                            ${tab === "departures"
                                ? `Arrival: ${flight.endTime}`
                                : `Departure: ${flight.startTime}`}
                        </div>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        return html;
    }

    let panelHTML = `
        <h2 class="airport-schedule-title">${todayTitle}</h2>
        ${renderFlightList(todayFlights)}

        <div class="airport-schedule-day-divider"></div>

        <h2 class="airport-schedule-title airport-schedule-tomorrow-title">
            ${tomorrowTitle}
        </h2>
        ${renderFlightList(tomorrowFlights)}
    `;

    content.innerHTML = panelHTML;

    content.scrollTop = 0;
}

function setAirportTab(tab) {
    if (!selectedAirportCode) return;

    activeAirportTab = tab;

    document.querySelectorAll(".airport-tab").forEach(button => {

        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");

function renderAirportDestinations(code) {

    selectedAirportCode = code;
    selectedRouteKey = null;
    updateFilterVisibility();

    const airport = airports[code];

    document.getElementById("info-panel").style.display = "block";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    const selectedEl = document.getElementById(`marker-${code}`);
    if (selectedEl) selectedEl.classList.add("selected");

    /*
       Only direct destinations from the selected airport are shown.
       There is no special handling for TOS/BOO/TRD anymore:
       every route is an ordinary direct route.
    */
    const connectedRoutes = routes.filter(route =>
        route.from === code || route.to === code
    );

    const destinationEntries = connectedRoutes.map(route => {

        const destinationCode =
            route.from === code ? route.to : route.from;

        const destination = airports[destinationCode];

        return {
            code: destinationCode,
            airport: destination,
            charter: route.charter || false,
            domestic: destination.country === airport.country
        };
    });

    /*
       Selected airport + its direct destinations stay visible.
       Every other airport fades.
    */
    const visibleAirports = new Set([code]);

    destinationEntries.forEach(entry => {
        visibleAirports.add(entry.code);
    });

    Object.keys(airports).forEach(airportCode => {

        const markerEl =
            document.getElementById(`marker-${airportCode}`);

        if (!markerEl) return;

        if (!visibleAirports.has(airportCode)) {
            markerEl.classList.add("fade-out");

            if (airportMarkers[airportCode]) {
                airportMarkers[airportCode].closeTooltip();
            }
        }
    });

    /*
       Highlight only routes directly connected to the selected airport.
    */
    routeLayers.forEach(line => {

        const route = line.routeData;

        const connected =
            route.from === code ||
            route.to === code;

        line.setStyle({
            color: connected
                ? getComputedStyle(document.documentElement)
                    .getPropertyValue("--route-active").trim()
                : getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
            weight: connected ? 4 : 1,
            opacity: connected ? 1 : 0.10
        });
    });

    /*
       Top-left airport information panel.
       Large = airport name + country.
       Small = IATA / ICAO.
    */
    document.getElementById("airport-name").textContent =
        `${airport.name} · ${airport.country}`;

    document.getElementById("airport-code").textContent =
        `${code} / ${airport.icao}`;

    let panelHTML = "";

    const nordicaPriority = {
        OSL: 0,
        BGO: 1,
        SVG: 2
    };

    const destinationSort = (a, b) => {

        const aPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, a.code)
                ? nordicaPriority[a.code]
                : 99;

        const bPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, b.code)
                ? nordicaPriority[b.code]
                : 99;

        if (aPriority !== bPriority) {
            return aPriority - bPriority;
        }

        return a.airport.city.localeCompare(b.airport.city);
    };

    const domestic = destinationEntries
        .filter(entry => entry.domestic && !entry.charter)
        .sort(destinationSort);

    const international = destinationEntries
        .filter(entry => !entry.domestic && !entry.charter)
        .sort(destinationSort);

    const charter = destinationEntries
        .filter(entry => entry.charter)
        .sort(destinationSort);

    /*
       Domestic destinations first.
    */
    if (domestic.length) {

        panelHTML += `
            <div class="section">
                Domestic · ${domestic.length}
            </div>
        `;

        domestic.forEach(entry => {

            panelHTML += `
                <div class="destination clickable" data-destination-code="${entry.code}">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.charter
                                    ? "Charter"
                                    : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       International destinations second.
    */
    if (international.length) {

        panelHTML += `
            <div class="section">
                International · ${international.length}
            </div>
        `;

        international.forEach(entry => {

            panelHTML += `
                <div class="destination clickable" data-destination-code="${entry.code}">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.charter
                                    ? "Charter"
                                    : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       Charter destinations are listed separately below
       international destinations.
    */
    if (charter.length) {

        panelHTML += `
            <div class="section">
                Charter · ${charter.length}
            </div>
        `;

        charter.forEach(entry => {

            panelHTML += `
                <div class="destination clickable" data-destination-code="${entry.code}">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        Charter
                    </div>
                </div>
            `;
        });
    }

    panelHTML += `
        
    `;

    document.getElementById("panel-content").innerHTML =
        panelHTML;

    applyNetworkFilters();

    map.panTo(
        [airport.lat, airport.lng],
        {
            animate: true,
            duration: 0.5
        }
    );
}

const activeFilters = {
    domestic: false,
    international: false,
    charter: false
};

function getRouteCategory(route) {

    if (route.charter) return "charter";

    const from = airports[route.from];
    const to = airports[route.to];

    return from && to && from.country === to.country
        ? "domestic"
        : "international";
}

function routePassesFilters(route) {
    const category = getRouteCategory(route);

    const anyFilterActive =
        activeFilters.domestic ||
        activeFilters.international ||
        activeFilters.charter;

    if (!anyFilterActive) return true;

    return activeFilters[category];
}

function updateFilterVisibility() {
    const filters = document.getElementById("network-filters");
    if (!filters) return;

    // Filter buttons are hidden during a specific two-airport route view.
    if (selectedRouteKey) {
        filters.style.display = "none";
        return;
    }

    filters.style.display = "flex";

    // Determine which categories are actually represented in the current view.
    let visibleRoutes = routes;

    if (selectedAirportCode) {
        visibleRoutes = routes.filter(route =>
            route.from === selectedAirportCode ||
            route.to === selectedAirportCode
        );
    }

    const availableCategories = new Set(
        visibleRoutes.map(route => getRouteCategory(route))
    );

    document.querySelectorAll(".filter-button").forEach(button => {
        const category = button.dataset.filter;
        const available = availableCategories.has(category);

        button.style.display = available ? "" : "none";

        // If a currently active filter is no longer relevant in the new view,
        // turn it off.
        if (!available && activeFilters[category]) {
            activeFilters[category] = false;
            button.classList.remove("active");
        }
    });

    // If there are no active filters after the visibility update, the full
    // applicable network is displayed.
    applyNetworkFilters();
}

function applyNetworkFilters() {

    routeLayers.forEach(line => {

        const route = line.routeData;
        const categoryVisible = routePassesFilters(route);

        if (!categoryVisible) {
            line.setStyle({
                opacity: 0,
                weight: 0
            });
            return;
        }

        // Preserve the current selection state.
        if (selectedRouteKey) {

            const selected = 
                `${route.from}-${route.to}` === selectedRouteKey ||
                `${route.to}-${route.from}` === selectedRouteKey;

            line.setStyle({
                color: selected
                    ? getComputedStyle(document.documentElement)
                        .getPropertyValue("--route-active").trim()
                    : getComputedStyle(document.documentElement)
                        .getPropertyValue("--route").trim(),
                weight: selected ? 5 : 1,
                opacity: selected ? 1 : 0.08
            });

        } else if (selectedAirportCode) {

            const connected =
                route.from === selectedAirportCode ||
                route.to === selectedAirportCode;

            line.setStyle({
                color: connected
                    ? getComputedStyle(document.documentElement)
                        .getPropertyValue("--route-active").trim()
                    : getComputedStyle(document.documentElement)
                        .getPropertyValue("--route").trim(),
                weight: connected ? 2.5 : 1,
                opacity: connected ? 1 : 0.08
            });

        } else {

            line.setStyle({
                color: getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
                weight: 1.5,
                opacity: 0.45
            });
        }
    });

    // Hide airports that have no visible route under the active filter.
    const visibleByFilter = new Set();

    routes.forEach(route => {
        if (!routePassesFilters(route)) return;
        visibleByFilter.add(route.from);
        visibleByFilter.add(route.to);
    });

    Object.keys(airports).forEach(code => {

        const markerEl = document.getElementById(`marker-${code}`);
        if (!markerEl) return;

        if (!visibleByFilter.has(code)) {
            markerEl.classList.add("filter-hidden");
            if (airportMarkers[code]) {
                airportMarkers[code].closeTooltip();
            }
        } else {
            markerEl.classList.remove("filter-hidden");
        }
    });
}

document.querySelectorAll(".filter-button").forEach(button => {

    button.addEventListener("click", function(e) {

        e.stopPropagation();

        const filter = this.dataset.filter;

        // Only one category can be active at a time. Clicking the
        // currently active button turns filtering off and restores all routes.
        const wasActive = activeFilters[filter];

        Object.keys(activeFilters).forEach(key => {
            activeFilters[key] = false;
        });

        if (!wasActive) {
            activeFilters[filter] = true;
        }

        document.querySelectorAll(".filter-button").forEach(btn => {
            btn.classList.toggle("active", activeFilters[btn.dataset.filter]);
        });

        applyNetworkFilters();
        updateFilterVisibility();
    });
});

function resetMap() {

    selectedAirportCode = null;
    selectedRouteKey = null;
    updateFilterVisibility();

    document.getElementById("info-panel").style.display = "none";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    routeLayers.forEach(line => {
        line.setStyle({
            color: getComputedStyle(document.documentElement)
                .getPropertyValue("--route").trim(),
            weight: 1.5,
            opacity: 0.45
        });
    });

    applyNetworkFilters();

    const airportDisplayName = code === "LPA" ? "Gran Canaria" : airport.name;
    document.getElementById("airport-name").textContent = `${airportDisplayName} ${code}`;

    document.getElementById("airport-code").textContent =
        "OSL / ENGM · Primary Hub";

    document.getElementById("panel-content").innerHTML = `
        <div class="empty-state">
            Hover over an airport to see its name.<br><br>
            Click an airport to see all destinations served from that airport.
        </div>
    `;
}

    const coordinates =
        Object.values(airports).map(airport => [
            airport.lat,
            airport.lng
        ]);

    if (!coordinates.length) return;

    const bounds = L.latLngBounds(coordinates);

    map.fitBounds(bounds, {
        padding: [60, 60],
        maxZoom: 5
    });
}

const scheduleDays = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function scheduleRouteKey(a, b) {
    const direct = `${a}-${b}`;
    const reverse = `${b}-${a}`;

    if (tosSchedules[direct]) return direct;
    if (tosSchedules[reverse]) return reverse;

    if (typeof tosThroughLegSchedules !== "undefined") {
        if (tosThroughLegSchedules[direct]) return direct;
        if (tosThroughLegSchedules[reverse]) return reverse;
    }

    if (additionalSchedules[direct]) return direct;
    if (additionalSchedules[reverse]) return reverse;

    if (bgoSchedules[direct]) return direct;
    if (bgoSchedules[reverse]) return reverse;

    return direct;
}

// Calendar bounds are calculated from the user's current local date.
// The current month is always the first available month, and 12 future
// months are available after it (13 calendar months inclusive).
function getScheduleToday() {
    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Oslo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    const values = {};
    parts.forEach(part => {
        if (part.type !== "literal") values[part.type] = part.value;
    });

    return {
        year: Number(values.year),
        month: Number(values.month) - 1,
        day: Number(values.day)
    };
}

function getScheduleMinDate() {
    const today = getScheduleToday();
    return { year: today.year, month: today.month };
}

function getScheduleMaxDate() {
    const min = getScheduleMinDate();
    const date = new Date(min.year, min.month + 12, 1);
    return { year: date.getFullYear(), month: date.getMonth() };
}

let scheduleCalendarYear = getScheduleMinDate().year;
let scheduleCalendarMonth = getScheduleMinDate().month;

    "January", "February", "March", "April", "May", "June",
