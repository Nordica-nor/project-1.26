<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nordica — Network</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
:root {
    --water: #1d2f4b;
    --land: #263e65;
    --land-border: #4671b8;
    --navy: #1d2f4b;
    --route: #4671b8;
    --route-active: #4671b8;
    --holidays: #ff8a05;
    --airport: #f4f7fa;
    --hub: #ffffff;
    --text: #f4f7fa;
    --muted: #9eafc0;
    --panel: rgba(8, 22, 39, 0.96);
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--water);
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: calc(100% - 76px);
    min-height: 0;
    background: #1d2f4b;
}

/* Airport information is shown only in the top-left panel. */

/* Information panel */
#info-panel {
    display: none;
    position: absolute;
    z-index: 1000;
    top: 96px;
    left: 20px;
    width: 390px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.40);
    backdrop-filter: blur(8px);
    overflow: hidden;
}

#panel-header {
    padding: 18px 20px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.eyebrow {
    color: #4671b8;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

#airport-name {
    margin: 0;
    font-size: 24px;
}

#airport-code {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

#airport-code strong {
    color: var(--text);
    font-weight: 700;
}

#panel-content {
    padding: 16px 20px 20px;
    max-height: 55vh;
    overflow-y: auto;
}

.empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    margin-bottom: 5px;
}


.airport-role {
    margin-top: 8px;
}

.airport-tabs {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    margin-top: 14px;
    height: 42px;
    padding: 0;
    border-bottom: 1px solid 

rgba(255,255,255,.10);
}

.airport-tab {
    position: relative;
    flex: 1 1 33.333%;
    height: 42px;
    min-width: 0;
    padding: 0 8px;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 9px 9px 0 0;
    background: transparent;
    color: rgba(255,255,255,.55);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.airport-tab:hover {
    color: #fff;
    background: rgba(255,255,255,.045);
}

.airport-tab.active {
    border-color: rgba(255,255,255,.10);
    background: #263e65;
    color: #fff;
}

.airport-tab.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    background: #4671b8;
    border-radius: 2px;
}

.airport-schedule-title {
    margin: 0 0 12px;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
}

.airport-schedule-list {
    width: 100%;
}

.airport-schedule-flight {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.airport-schedule-flight:last-child {
    border-bottom: none;
}

.airport-schedule-iata {
    margin-left: 5px;
    color: rgba(255,255,255,.66);
    font-size: 13px;
    font-weight: 600;
}

.airport-schedule-route {
    color: var(--text);
    font-size: 16px;
    line-height: 1.05;
}

.airport-schedule-time {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    justify-self: end;
}

.airport-schedule-secondary-time {
    margin-top: 0;
    color: rgba(255,255,255,.66);
    font-size: 11px !important;
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    text-align: right;
}


.airport-schedule-meta {
    margin-top: 3px;
    color: rgba(255,255,255,.60);
    font-size: 11px;
    line-height: 1.35;
}

.airport-schedule-number {
    color: rgba(255,255,255,.72);
    font-weight: 700;
}

.airport-schedule-empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

@media (max-width: 700px) {
    #map { height: calc(100% - 68px); }

    .airport-tab {
        font-size: 11px;
        padding: 0 4px;
    }
}

.section {
    margin-top: 18px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.destination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.destination:last-child {
    border-bottom: none;
}

.destination-code {
    font-weight: 700;
    font-size: 14px;
}

.destination-name {
    color: var(--text);
    font-size: 12px;
    margin-right: 6px;
}

.route-info {
    color: #4671b8;
    font-size: 11px;
}

#reset {
    width: 100%;
    margin-top: 17px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: #263e65;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

#reset:hover {
    background: #4671b8;
}

/* Airport markers */
.airport-marker {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--airport);
    border: 2px solid #263e65;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
    box-sizing: border-box;
}

.airport-marker.filter-hidden {
    opacity: 0 !important;
    pointer-events: none !important;
}

.airport-marker.hub {
    width: 11px;
    height: 11px;
    border: 2px solid #263e65;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
}

.airport-marker.selected {
    opacity: 1;
}

.airport-marker.fade-out {
    opacity: 0.18;
}

/* Airport labels */
.airport-label {
    color: white;
    background: transparent;
    border: none;
    box-shadow: none;
    font-size: 11px;
    font-weight: 700;
    text-shadow:
        0 1px 3px #1d2f4b,
        1px 0 3px #1d2f4b,
        -1px 0 3px #1d2f4b;
}

.airport-label::before {
    display: none;
}

/* Hover popup */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #1d2f4b;
    color: white;
}

.leaflet-popup-content {
    margin: 12px 14px;
}

.popup-title {
    font-size: 16px;
    font-weight: 700;
}

.popup-code {
    color: #4671b8;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 0;
}

.popup-info {
    color: #9eafc0;
    font-size: 12px;
    line-height: 1.45;
    margin-top: 8px;
}

.leaflet-control-attribution {
    background: rgba(7,20,38,.80) !important;
    color: #8fa2b6 !important;
}

.leaflet-control-attribution a {
    color: #4671b8 !important;
}

@media (max-width: 600px) {
    #info-panel {
        top: 10px;
        left: 10px;
        width: 285px;
    }
}

.route-detail {
    padding-top: 2px;
}

.route-detail-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--muted);
    font-size: 12px;
}

.route-detail-row strong {
    color: var(--text);
    font-size: 15px;
    text-align: right;
    line-height: 1.35;
    max-width: 65%;
}

.route-detail-row.seasonal-row strong {
    color: var(--text);
}


.destination.clickable {
    cursor: pointer;
    margin-left: -8px;
    margin-right: -8px;
    padding-left: 8px;
    padding-right: 8px;
    border-radius: 6px;
}
.destination.clickable:hover {
    background: rgba(255,255,255,0.04);
}


#panel-header {
    position: relative;
}

#panel-switch {
    display: none;
    position: absolute;
    top: 76px;
    right: 9px;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    color: rgba(255,255,255,.78);
    font-size: 25px;
    line-height: 32px;
    cursor: pointer;
    z-index: 20;
}
#info-panel.route-no-season:not(.route-starts-april) #panel-switch {
    top: 52px;
}
#info-panel.route-starts-april #panel-switch {
    top: 52px;
}
#info-panel:not(.route-no-season) #panel-switch {
    top: 52px;
}
#panel-switch:hover {
    background: transparent;
    color: #fff;
}

#panel-close {
    position: absolute;
    top: 10px;
    right: 11px;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: rgba(244,247,250,0.52);
    font-size: 22px;
    font-weight: 300;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    border-radius: 50%;
    transition: color 0.15s ease, background 0.15s ease;
}

#panel-close:hover {
    color: rgba(244,247,250,0.90);
    background: rgba(255,255,255,0.07);
}

#panel-close:focus-visible {
    outline: 1px solid rgba(108,166,214,0.75);
    outline-offset: 2px;
}


.operator-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.operator-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.operator-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.operator-info .operator-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: 50%;
    right: auto;
    transform: translate(-50%, 3px);
    width: 250px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.operator-info .operator-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.operator-info:hover .operator-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}


#network-filters {
    position: absolute;
    z-index: 1100;
    top: 94px;
    right: 18px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 154px;
}

.filter-title {
    margin: 0 0 2px 2px;
    color: rgba(255,255,255,0.52);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.9px;
    text-transform: uppercase;
}

.filter-button {
    appearance: none;
    width: 100%;
    padding: 7px 11px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: rgba(10,18,28,0.58);
    color: rgba(255,255,255,0.70);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25px;
    text-align: left;
    cursor: pointer;
    box-shadow: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}

.filter-button:hover {
    background: rgba(20,32,45,0.72);
    border-color: rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.94);
}

.filter-button:active {
    background: rgba(24,39,54,0.78);
}

.filter-button.active {
    background: rgba(54,105,145,0.48);
    border-color: rgba(139,202,242,0.52);
    color: #fff;
}

.filter-button.active:hover {
    background: rgba(61,116,158,0.56);
    border-color: rgba(158,216,250,0.64);
}

.filter-button:focus-visible {
    outline: none;
    border-color: rgba(151,216,255,0.72);
    box-shadow: 0 0 0 2px rgba(90,170,225,0.14);
}

@media (max-width: 600px) {
    #network-filters {
        top: 78px;
        right: 10px;
        width: 142px;
        gap: 5px;
    }

    .filter-title {
        font-size: 9px;
    }

    .filter-button {
        padding: 7px 9px;
        font-size: 10px;
    }
}


.frequency-value {
    white-space: nowrap;
    font-size: 13px !important;
}

.flight-type-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 7px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.flight-type-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.flight-type-info .flight-type-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: auto;
    right: -6px;
    width: 270px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.flight-type-info .flight-type-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    right: 2px;
    left: auto;
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.flight-type-info:hover .flight-type-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(0, 0);
}


.airport-marker.special-base {
    position: relative;
}

.airport-marker.special-base::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #d62828;
}


.via-bodo {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
}

/* Route Schedule */
/* Embedded route calendar */

.holidays-operator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
}

.holidays-operator span {
    color: #ffffff;
    opacity: 1;
}

.holidays-operator img {
    display: block;
    width: 76px;
    height: auto;
    max-height: 28px;
    object-fit: contain;
}

.route-popup-comments {
    margin-top: 8px;
    color: rgba(255,255,255,.52);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.35;
    text-align: center;
}
.route-starts-april-message {
    min-height: 280px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 70px 20px;
    color: rgba(255,255,255,.78);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    text-align: center;
}
.route-calendar.schedule-transition-out {
    opacity: .32;
    transform: translateX(-7px);
    transition: opacity .18s ease, transform .18s ease;
}
.route-calendar.schedule-transition-in {
    opacity: 0;
    transform: translateX(7px);
    transition: opacity .26s ease, transform .26s ease;
}
#airport-name.route-title-main {
    font-size: 24px !important;
    line-height: 1.2 !important;
    font-weight: 600 !important;
}

#airport-name.route-title-main .route-title-subtitle {
    margin-top: 3px !important;
    color: rgba(255,255,255,.48) !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    line-height: 1.3 !important;
    text-align: left !important;
}

#airport-name.route-title-main .route-via-label {
    margin-top: 4px !important;
    color: rgba(255,255,255,.72) !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    line-height: 1.3 !important;
    text-align: left !important;
}

.route-season-subtitle {
    margin-top: 5px;
    font-size: 12px;
    font-style: italic;
    color: inherit;
    opacity: 0.9;
    position: relative;
    top: -16px;
}


.route-calendar {
    width: 100%;
    box-sizing: border-box;
    margin-top: -4px;
    padding-top: 2px;
    position: relative;
}

.route-calendar-loading {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 4px;
    color: rgba(255,255,255,.52);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-3px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s ease;
}

.route-calendar-loading.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.route-calendar-spinner {
    width: 11px;
    height: 11px;
    border: 2px solid rgba(255,255,255,.18);
    border-top-color: rgba(112,194,241,.95);
    border-radius: 50%;
    animation: routeCalendarSpin .65s linear infinite;
}

@keyframes routeCalendarSpin {
    to { transform: rotate(360deg); }
}

.route-calendar-header {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.route-calendar-month {
    margin: 0;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
}

.route-calendar-arrow {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.82);
    font-size: 20px;
    line-height: 28px;
    cursor: pointer;
    transition: .16s ease;
}

.route-calendar-arrow:hover {
    background: rgba(92,158,204,.20);
    border-color: rgba(130,205,250,.42);
    color: #fff;
}

.route-calendar-arrow.hidden {
    visibility: hidden;
    pointer-events: none;
}

.route-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: 28px repeat(6, 42px);
    border-top: 1px solid rgba(255,255,255,.09);
    border-left: 1px solid rgba(255,255,255,.09);
    border-radius: 8px;
    overflow: hidden;
}

.route-calendar-weekday {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15,20,27,.72);
    color: rgba(255,255,255,.54);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .25px;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
}

.route-calendar-day {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 7px 8px;
    border: 0;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
    background: rgba(29,37,48,.72);
    color: rgba(255,255,255,.82);
    font-family: Arial, Helvetica, sans-serif;

        overflow: auto;

        height: auto;
        grid-template-columns: 32px minmax(0, 1fr) 32px;
        grid-template-rows: auto auto;
        gap: 12px;

    }

    .schedule-prev-month {

        grid-row: 1 / span 2;

        grid-column: 3;
        grid-row: 1 / span 2;
    }

<style id="nordica-network-frame-v141">
/*
  V1.0.141
  The large navy strip at the bottom was not a frame; it was the unused
  76px of page height created by #map's calc(100% - 76px).
  Let the map occupy the entire viewport. The fixed header naturally covers
  its top portion, while the frame is drawn over the map itself.
*/
#map {
    height: 100% !important;
    width: 100% !important;
    border: 0 !important;
    box-sizing: border-box !important;
    position: relative !important;
}

/* Thin, visible side + bottom frame, above all Leaflet layers. */
#map::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    box-sizing: border-box;
    border-left: 3px solid rgba(255,255,255,0.12);
    border-right: 3px solid rgba(255,255,255,0.12);
    border-bottom: 3px solid rgba(255,255,255,0.12);
}

/* The header is 68px on mobile, but the map still fills the viewport. */
@media (max-width: 700px) {
    #map {
        height: 100% !important;
    }

    #map::after {
        border-left-width: 3px;
        border-right-width: 3px;
        border-bottom-width: 3px;
    }
}

   ROUTE DRAWING
   ========================================================== */

/*
   Build a great-circle arc between two airports.
   This makes long-haul routes follow the curvature of the Earth instead
   of appearing as straight lines on the flat map.
*/
function greatCirclePoints(from, to, segments = 48) {

    const lat1 = from.lat * Math.PI / 180;
    const lon1 = from.lng * Math.PI / 180;
    const lat2 = to.lat * Math.PI / 180;
    const lon2 = to.lng * Math.PI / 180;

    const x1 = Math.cos(lat1) * Math.cos(lon1);
    const y1 = Math.cos(lat1) * Math.sin(lon1);
    const z1 = Math.sin(lat1);

    const x2 = Math.cos(lat2) * Math.cos(lon2);
    const y2 = Math.cos(lat2) * Math.sin(lon2);
    const z2 = Math.sin(lat2);

    let dot = x1 * x2 + y1 * y2 + z1 * z2;
    dot = Math.max(-1, Math.min(1, dot));

    const angle = Math.acos(dot);

    // Identical / extremely close points.
    if (angle < 0.000001) {
        return [
            [from.lat, from.lng],
            [to.lat, to.lng]
        ];
    }

    const sinAngle = Math.sin(angle);
    const points = [];

    for (let i = 0; i <= segments; i++) {

        const t = i / segments;

        const a = Math.sin((1 - t) * angle) / sinAngle;
        const b = Math.sin(t * angle) / sinAngle;

        const x = a * x1 + b * x2;
        const y = a * y1 + b * y2;
        const z = a * z1 + b * z2;

        const lat = Math.atan2(z, Math.sqrt(x * x + y * y));
        const lon = Math.atan2(y, x);

        points.push([
            lat * 180 / Math.PI,
            lon * 180 / Math.PI
        ]);
    }

    return points;
}

const routeLayers = [];

routes.forEach(route => {

    const from = airports[route.from];
    const to = airports[route.to];

    if (!from || !to) return;

    // TOS ↔ TRD is a published through-service via Bodø. Draw it as
    // two connected route segments instead of a direct TOS ↔ TRD line.
    if (
        (route.from === "TOS" && route.to === "TRD") ||
        (route.from === "TRD" && route.to === "TOS")
    ) {
        const boo = airports["BOO"];
        if (boo) {
            const segmentA = L.polyline(
                greatCirclePoints(from, boo),
                { color: "#4671b8", weight: 2, opacity: 0.72, smoothFactor: 1 }
            ).addTo(map);
            const segmentB = L.polyline(
                greatCirclePoints(boo, to),
                { color: "#4671b8", weight: 2, opacity: 0.72, smoothFactor: 1 }
            ).addTo(map);

            segmentA.routeData = route;
            segmentB.routeData = route;
            routeLayers.push(segmentA, segmentB);
            return;
        }
    }

    const line = L.polyline(
        greatCirclePoints(from, to),
        {
            color: "#4671b8",
            weight: 2,
            opacity: 0.72,
            smoothFactor: 1
        }
    ).addTo(map);

    line.routeData = route;
    routeLayers.push(line);
});

const airportMarkers = {};

Object.entries(airports).forEach(([code, airport]) => {

    const markerClass =
        airport.hub
        ? "airport-marker hub"
        : "airport-marker";

    const icon = L.divIcon({
        className: "",
        html: `<div class="airport-marker ${["OSL","BGO","SVG","TOS","LPA"].includes(code) ? "special-base" : ""}" id="marker-${code}"></div>`,
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5]
    });

    const marker = L.marker(
        [airport.lat, airport.lng],
        {
            icon: icon,
            title: `${code} · ${airport.name}`
        }
    ).addTo(map);

    airportMarkers[code] = marker;


    /* Airport name appears only while hovering over the dot */
    marker.bindTooltip(
        `${airport.name} (${code})`,
        {
            permanent: false,
            direction: "top",
            offset: [0, -8],
            className: "airport-label",
            sticky: true
        }
    );

    marker.on("mouseover", function() {
        const markerElement = document.getElementById(`marker-${code}`);

        if (markerElement && markerElement.classList.contains("fade-out")) {
            this.closeTooltip();
        }
    });

    /* Popup is click-only */


    marker.on("click", function(e) {
        L.DomEvent.stopPropagation(e);

        // In a single-route view, clicking either endpoint again opens
        // that airport's complete network.
        if (selectedRouteKey) {
            const currentRoute = routes.find(route =>
                `${route.from}-${route.to}` === selectedRouteKey ||
                `${route.to}-${route.from}` === selectedRouteKey
            );

            if (
                currentRoute &&
                (currentRoute.from === code || currentRoute.to === code)
            ) {
                selectAirport(code);
                return;
            }
        }

        // From an airport-network view, clicking a connected destination
        // enters the single-route view.
        if (
            selectedAirportCode &&
            selectedAirportCode !== code &&
            routes.some(route =>
                (route.from === selectedAirportCode && route.to === code) ||
                (route.to === selectedAirportCode && route.from === code)
            )
        ) {
            selectRoute(selectedAirportCode, code);
        } else {
            selectAirport(code);
        }
    });
});

let selectedAirportCode = null;
let selectedRouteKey = null;
let scheduleRouteFrom = null;
let scheduleRouteTo = null;



/*
   Destination list items are clickable.
   Clicking a destination in the airport panel behaves exactly like:
   1. selecting the currently displayed airport, then
   2. selecting that destination as the second airport.

   The destination list itself is not altered visually.
*/
document.getElementById("panel-content").addEventListener("click", function(e) {

    const row = e.target.closest(".destination[data-destination-code]");

    if (!row || !selectedAirportCode) return;

    const destinationCode = row.dataset.destinationCode;

    if (!destinationCode || destinationCode === selectedAirportCode) return;

    e.stopPropagation();

    selectRoute(selectedAirportCode, destinationCode);
});

function selectRoute(originCode, destinationCode) {

    const route = routes.find(r =>
        (r.from === originCode && r.to === destinationCode) ||
        (r.from === destinationCode && r.to === originCode)
    );

    if (!route) return;

    // Selecting a specific route exits any active Domestic/International/Holidays
    // filter so the chosen route can always be displayed.
    Object.keys(activeFilters).forEach(key => {
        activeFilters[key] = false;
    });

    document.querySelectorAll(".filter-button").forEach(button => {
        button.classList.remove("active");
    });

    selectedRouteKey = `${route.from}-${route.to}`;

    const panelSwitch = document.getElementById("panel-switch");
    if (panelSwitch) panelSwitch.style.display = "flex";

    const airportTabs = document.getElementById("airport-tabs");
    if (airportTabs) airportTabs.style.display = "none";
    scheduleRouteFrom = originCode;
    scheduleRouteTo = destinationCode;
    updateFilterVisibility();

    const origin = airports[originCode];
    const destination = airports[destinationCode];

    document.getElementById("info-panel").style.display = "block";

    /*
       Only the two airports and this one route remain fully visible.
       Everything else fades.
    */
    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    const originEl = document.getElementById(`marker-${originCode}`);
    const destinationEl = document.getElementById(`marker-${destinationCode}`);
    const isTosTrdThroughRoute =
        (originCode === "TOS" && destinationCode === "TRD") ||
        (originCode === "TRD" && destinationCode === "TOS");
    const booEl = document.getElementById("marker-BOO");

    if (originEl) originEl.classList.add("selected");
    if (destinationEl) destinationEl.classList.add("selected");
    if (isTosTrdThroughRoute && booEl) booEl.classList.add("selected");

    Object.keys(airports).forEach(code => {
        if (code !== originCode && code !== destinationCode && !(isTosTrdThroughRoute && code === "BOO")) {
            const el = document.getElementById(`marker-${code}`);
            if (el) {
                el.classList.add("fade-out");
                if (airportMarkers[code]) {
                    airportMarkers[code].closeTooltip();
                }
            }
        }
    });

    routeLayers.forEach(line => {

        const r = line.routeData;

        const isSelected =
            (r.from === originCode && r.to === destinationCode) ||
            (r.from === destinationCode && r.to === originCode);

        line.setStyle({
            color: isSelected
                ? getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim()
                : getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
            weight: isSelected ? 5 : 1,
            opacity: isSelected ? 1 : 0.08
        });
    });

    const routeOriginName = originCode === "LPA" ? "Gran Canaria" : origin.name;
    const routeDestinationName = destinationCode === "LPA" ? "Gran Canaria" : destination.name;

    // Route main title uses the city name only; the smaller subtitle retains
    // the full airport name + IATA code.
    const routeOriginCity = originCode === "LPA"
        ? "Gran Canaria"
        : originCode === "LHR"
            ? "London Heathrow"
            : origin.city;
    const routeDestinationCity = destinationCode === "LPA"
        ? "Gran Canaria"
        : destinationCode === "LHR"
            ? "London Heathrow"
            : destination.city;

    const airportNameEl = document.getElementById("airport-name");
    airportNameEl.classList.add("route-title-main");

    airportNameEl.innerHTML =
        `${routeOriginCity} - ${routeDestinationCity}<div class="route-title-subtitle">${routeOriginName} (${originCode}) - ${routeDestinationName} (${destinationCode})</div>${isTosTrdThroughRoute ? `<div class="route-via-label">Via Bodø</div>` : ""}`;

    // Route pop-ups must not carry over the role/crew-base label
    // from the previously selected airport.
    const roleEl = document.getElementById("airport-role");
    if (roleEl) roleEl.innerHTML = "";

    const nordicAirlinkRoutes = new Set([
        ["TOS","ALF"], ["TOS","KKN"], ["TOS","BOO"], ["TOS","TRD"],
        ["TRD","BOO"], ["BGO","TRD"], ["BGO","SVG"], ["BGO","AES"], ["BGO","TRF"], ["BGO","TOS"], ["SVG","TRD"], ["TOS","ANX"]
    ].map(([from, to]) => [from, to].sort().join("-")));

    const routePair = [originCode, destinationCode].sort().join("-");
    const isNordicAirlink = nordicAirlinkRoutes.has(routePair);

    const outboundSchedule = getScheduleDirectionData("outbound");
    const inboundSchedule = getScheduleDirectionData("inbound");

    // Empty schedule objects are used for announced future routes. They
    // should not cause a calendar to be displayed.
    const hasAnySchedule = [outboundSchedule, inboundSchedule]
        .filter(Boolean)
        .some(data =>
            scheduleWeekdayNames.some(day =>
                Array.isArray(data[day]) && data[day].length > 0
            )
        );

    const routeComments = [];
    if (isNordicAirlink) {
        routeComments.push(`<span class="operator-label">Operated by <strong>Nordic Airlink</strong><span class="operator-info">?<span class="operator-tooltip">Routes operated by Nordic Airlink primarily serve commuters and may offer a reduced onboard serving</span></span></span>`);
    }

    const currentRoute = routes.find(r =>
        (r.from === originCode && r.to === destinationCode) ||
        (r.from === destinationCode && r.to === originCode)
    );

    const hasHolidaysFlights = routeHasHolidaysFlights(currentRoute);
    const hasRegularFlights = routeHasRegularFlights(currentRoute);
    const isMixedFlightTypeRoute = hasHolidaysFlights && hasRegularFlights;

    if (currentRoute?.holidays && !isMixedFlightTypeRoute) {
        routeComments.push(`<span class="holidays-operator">Operated by <img src="${holidaysLogoDataUri}" alt="Holidays"></span>`);
    }

    const startsMonth = currentRoute?.startsMonth || "April";
    const startsYear = currentRoute?.startsYear || 2027;
    const startsText = currentRoute?.startsText || `Starts in ${startsMonth} ${startsYear}`;
    const startsInFuture = (() => {
        if (!currentRoute?.startsMonth || !currentRoute?.startsYear) return false;
        const monthNumbers = {
            january: 0, february: 1, march: 2, april: 3,
            may: 4, june: 5, july: 6, august: 7,
            september: 8, october: 9, november: 10, december: 11
        };
        const startMonth = monthNumbers[String(currentRoute.startsMonth).toLowerCase()];
        if (startMonth == null) return false;
        const todayIndex = today.year * 12 + today.month;
        const startIndex = Number(currentRoute.startsYear) * 12 + startMonth;
        return todayIndex < startIndex;
    })();

function getIsoWeekMonday(isoYear, isoWeek) {
    const jan4 = new Date(Date.UTC(isoYear, 0, 4));
    const jan4Day = jan4.getUTCDay() || 7;
    const monday = new Date(jan4);
    monday.setUTCDate(jan4.getUTCDate() - (jan4Day - 1) + (isoWeek - 1) * 7);
    return monday;
}

function getRouteOperatingMonthRange() {
    const directions = [
        getScheduleDirectionData("outbound"),
        getScheduleDirectionData("inbound")
    ].filter(Boolean);

    const seasonalFlights = [];
    directions.forEach(data => {
        scheduleWeekdayNames.forEach(day => {
            (data[day] || []).forEach(flight => {
                if (flight && flight.startWeek != null && flight.endWeek != null) {
                    seasonalFlights.push(flight);
                }
            });
        });
    });

    if (!seasonalFlights.length) return null;

    const startWeek = Math.min(...seasonalFlights.map(f => Number(f.startWeek)));
    const endWeek = Math.max(...seasonalFlights.map(f => Number(f.endWeek)));
    if (!Number.isFinite(startWeek) || !Number.isFinite(endWeek)) return null;

    const today = getScheduleToday();
    const candidateYears = [today.year - 1, today.year, today.year + 1];
    let bestRange = null;

    for (const startIsoYear of candidateYears) {
        const seasonStart = getIsoWeekMonday(startIsoYear, startWeek);
        const endIsoYear = startWeek > endWeek ? startIsoYear + 1 : startIsoYear;
        const seasonEnd = getIsoWeekMonday(endIsoYear, endWeek);
        seasonEnd.setUTCDate(seasonEnd.getUTCDate() + 6);

        let firstDeparture = null;
        let lastDeparture = null;

        for (let cursor = new Date(seasonStart); cursor <= seasonEnd; cursor.setUTCDate(cursor.getUTCDate() + 1)) {
            const localDate = new Date(cursor.getUTCFullYear(), cursor.getUTCMonth(), cursor.getUTCDate());
            const weekdayIndex = (cursor.getUTCDay() + 6) % 7;
            const weekday = scheduleWeekdayNames[weekdayIndex];
            const hasDeparture = directions.some(data =>
                (data[weekday] || []).some(flight => isScheduleActiveForDate(flight, localDate))
            );

            if (hasDeparture) {
                if (!firstDeparture) firstDeparture = new Date(cursor);
                lastDeparture = new Date(cursor);
            }
        }

        if (firstDeparture && lastDeparture) {
            const distance = Math.abs(startIsoYear - today.year);
            if (!bestRange || distance < bestRange.distance) {
                bestRange = { firstDeparture, lastDeparture, distance };
            }
        }
    }

    if (!bestRange) return null;

    return {
        startMonth: scheduleMonthNames[bestRange.firstDeparture.getUTCMonth()],
        endMonth: scheduleMonthNames[bestRange.lastDeparture.getUTCMonth()]
    };
}

function getAirportTodaySchedule(code, dayOffset = 0) {
    const scheduleLookupDate = new Date();
    scheduleLookupDate.setDate(scheduleLookupDate.getDate() + dayOffset);
    const today = getScheduleToday();
    const date = new Date(Date.UTC(today.year, today.month, today.day + dayOffset));
    const weekday = scheduleWeekdayNames[(date.getUTCDay() + 6) % 7];

    const departures = [];
    const arrivals = [];

    /*
       Airport boards must reflect the actual operating season, not just the
       weekday contained in a timetable. This is especially important for
       seasonal routes such as BGO-TFS, which may have a Sunday schedule but
       do not operate until their published start month.
    */
    const monthNumbers = {
        january: 0, february: 1, march: 2, april: 3,
        may: 4, june: 5, july: 6, august: 7,
        september: 8, october: 9, november: 10, december: 11
    };

    const isFlightOperatingOnDate = (originCode, destinationCode, flightDate, flightDetails = null) => {
        const route = routes.find(r =>
            (r.from === originCode && r.to === destinationCode) ||
            (r.from === destinationCode && r.to === originCode)
        );

        if (!route) return true;

        const year = flightDate.getUTCFullYear();
        const month = flightDate.getUTCMonth();

        // Explicit future start dates are checked first.
        if (route.startsYear != null && route.startsMonth) {
            const startMonth = monthNumbers[String(route.startsMonth).toLowerCase()];
            if (startMonth != null) {
                const currentIndex = year * 12 + month;
                const startIndex = Number(route.startsYear) * 12 + startMonth;
                if (currentIndex < startIndex) return false;
            }
        }

        // Individual flights are authoritative when they carry explicit
        // operating-week limits. This is essential for routes that combine
        // year-round service with seasonal additional capacity.
        const hasFlightLevelWeeks =
            flightDetails &&
            (flightDetails.startWeek != null || flightDetails.endWeek != null);

        if (hasFlightLevelWeeks) {
            return isScheduleActiveForDate(flightDetails, flightDate);
        }

        // Fall back to route-level metadata only for legacy timetable rows
        // that do not yet carry their own operating-week fields.
        if (route.startWeek != null && route.endWeek != null &&
            !isScheduleActiveForDate(route, flightDate)) {
            return false;
        }

        const seasonText = String(route.season || "").trim().toLowerCase();
        if (seasonText && seasonText !== "year-round") {
            const range = seasonText.match(/^([a-z]+)\s*-\s*([a-z]+)$/);

            if (range) {
                const startMonth = monthNumbers[range[1]];
                const endMonth = monthNumbers[range[2]];

                if (startMonth != null && endMonth != null) {
                    if (startMonth <= endMonth) {
                        if (!(month >= startMonth && month <= endMonth)) return false;
                    } else {
                        if (!(month >= startMonth || month <= endMonth)) return false;
                    }
                }
            }
        }

        return true;

        return true;
    };

    const addFlight = (originCode, destinationCode, flight, timeRange, via, flightDetails = null) => {
        if (!isFlightOperatingOnDate(originCode, destinationCode, date, flightDetails)) return;

        const parts = String(timeRange || "").split(/\s*-\s*/);
        const departureTime = parts[0] || "";
        const arrivalTime = parts[1] || "";

        const details = splitFlightDetails(flight);

        if (originCode === code) {
            departures.push({
                time: departureTime,
                endTime: arrivalTime,
                originCode,
                destinationCode,
                flight: details.number,
                aircraft: details.aircraft,
                via: via || ""
            });
        }

        if (destinationCode === code) {
            arrivals.push({
                time: arrivalTime,
                startTime: departureTime,
                originCode,
                destinationCode,
                flight: details.number,
                aircraft: details.aircraft,
                via: via || ""
            });
        }
    };

    // Standard TOS schedules. TOS-TRD is handled by the through-service
    // timetable below so that TOS/TRD do not receive duplicate flights.
    Object.entries(tosSchedules).forEach(([key, schedule]) => {
        if (key === "TOS-TRD") return;

        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time, undefined, flight));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time, undefined, flight));
        });
    });

    // Additional schedules from KRS, TRD and SVG schedule documents.
    Object.entries(additionalSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time, undefined, flight));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time, undefined, flight));
        });
    });

    // BGO schedule document. All flights are assumed year-round.
    Object.entries(bgoSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time, undefined, flight));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time, undefined, flight));
        });
    });

    // Through-service TOS ↔ TRD. At TOS and TRD the published schedule
    // represents the complete journey; at BOO the individual leg schedule
    // is used below.
    const through = tosThroughServiceSchedule["TOS-TRD"];
    if (through) {
        (through.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time =>
                addFlight("TOS", "TRD", flight.flight, time, flight.via)
            );
        });

        (through.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time =>
                addFlight("TRD", "TOS", flight.flight, time, flight.via)
            );
        });
    }

    // Individual Bodø legs. These are used for BOO and also provide the
    // actual operating leg schedule at the intermediate airport.
    Object.entries(tosThroughLegSchedules).forEach(([key, schedule]) => {
        const [a, b] = key.split("-");

        (schedule.outbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(a, b, flight.flight, time, undefined, flight));
        });

        (schedule.inbound?.[weekday] || []).forEach(flight => {
            (flight.times || []).forEach(time => addFlight(b, a, flight.flight, time, undefined, flight));
        });
    });

    // Remove duplicate leg entries at TOS/TRD because those are already
    // represented by the through-service timetable above.
    const dedupe = flights => {
        const seen = new Set();
        return flights.filter(f => {
            const key = [
                f.time, f.endTime, f.startTime,
                f.originCode, f.destinationCode, f.flight
            ].join("|");

            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    };

    // TOS-TRD is a through-service via Bodø. It should therefore not
    // appear as a direct TOS↔TRD departure/arrival on either airport board.
    const filteredDepartures = departures.filter(flight =>
        !(
            (code === "TOS" && flight.destinationCode === "TRD") ||
            (code === "TRD" && flight.destinationCode === "TOS")
        )
    );

    const filteredArrivals = arrivals.filter(flight =>
        !(
            (code === "TOS" && flight.originCode === "TRD") ||
            (code === "TRD" && flight.originCode === "TOS")
        )
    );

    return {
        departures: dedupe(filteredDepartures).sort((a, b) =>
            a.time.localeCompare(b.time)
        ),
        arrivals: dedupe(filteredArrivals).sort((a, b) =>
            a.time.localeCompare(b.time)
        )
    };
}

function renderAirportScheduleTab(code, tab) {
    const content = document.getElementById("panel-content");
    if (!content) return;

    if (tab === "destinations") {
        renderAirportDestinations(code);
        return;
    }

    const todaySchedule = getAirportTodaySchedule(code, 0);
    const tomorrowSchedule = getAirportTodaySchedule(code, 1);

    const todayFlights = todaySchedule[tab] || [];
    const tomorrowFlights = tomorrowSchedule[tab] || [];

    const todayTitle = tab === "departures"
        ? "Departures today"
        : "Arrivals today";

    const tomorrowTitle = tab === "departures"
        ? "Departures tomorrow"
        : "Arrivals tomorrow";

    const formatBoardDate = (dayOffset) => {
        const base = getScheduleToday();
        const boardDate = new Date(Date.UTC(
            base.year,
            base.month,
            base.day + dayOffset
        ));

        return boardDate.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            timeZone: "UTC"
        });
    };

    function renderFlightList(flights) {
        if (!flights.length) {
            return `<div class="airport-schedule-empty">No scheduled flights.</div>`;
        }

        let html = `<div class="airport-schedule-list">`;

        flights.forEach(flight => {
            const otherCode =
                tab === "departures" ? flight.destinationCode : flight.originCode;
            const otherAirport = airports[otherCode];

            const routeText =
                `${otherAirport.name} <span class="airport-schedule-iata">(${otherCode})</span>`;

            const operator =
                isNordicAirlinkRoute(flight.originCode, flight.destinationCode)
                    ? `<div class="airport-schedule-meta">Nordic Airlink</div>`
                    : "";

            html += `
                <div class="airport-schedule-flight">
                    <div>
                        <div class="airport-schedule-route">${routeText}</div>
                        <div class="airport-schedule-meta">
                            <span class="airport-schedule-number">Flight ${flight.flight}</span>
                            · ${flight.aircraft}
                        </div>
                        ${operator}
                    </div>
                    <div>
                        <div class="airport-schedule-time">
                            ${flight.time}
                        </div>
                        <div class="airport-schedule-secondary-time">
                            ${tab === "departures"
                                ? `Arrival: ${flight.endTime}`
                                : `Departure: ${flight.startTime}`}
                        </div>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        return html;
    }

    let panelHTML = `
        <h2 class="airport-schedule-title">${todayTitle}</h2>
        <div class="airport-schedule-date">${formatBoardDate(0)}</div>
        ${renderFlightList(todayFlights)}

        <div class="airport-schedule-day-divider"></div>

        <h2 class="airport-schedule-title airport-schedule-tomorrow-title">
            ${tomorrowTitle}
        </h2>
        <div class="airport-schedule-date">${formatBoardDate(1)}</div>
        ${renderFlightList(tomorrowFlights)}
    `;

    content.innerHTML = panelHTML;

    content.scrollTop = 0;
}

function renderAirportDestinations(code) {

    selectedAirportCode = code;
    selectedRouteKey = null;
    updateFilterVisibility();

    const airport = airports[code];

    document.getElementById("info-panel").style.display = "block";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    const selectedEl = document.getElementById(`marker-${code}`);
    if (selectedEl) selectedEl.classList.add("selected");

    /*
       Only direct destinations from the selected airport are shown.
       There is no special handling for TOS/BOO/TRD anymore:
       every route is an ordinary direct route.
    */
    const connectedRoutes = routes.filter(route =>
        route.from === code || route.to === code
    );

    const destinationEntries = connectedRoutes.map(route => {

        const destinationCode =
            route.from === code ? route.to : route.from;

        const destination = airports[destinationCode];

        const hasHolidaysFlights = routeHasHolidaysFlights(route);
        const hasRegularFlights = routeHasRegularFlights(route);

        return {
            code: destinationCode,
            airport: destination,
            holidays: route.holidays || false,
            mixed: hasHolidaysFlights && hasRegularFlights,
            domestic: destination.country === airport.country
        };
    });

    /*
       Selected airport + its direct destinations stay visible.
       Every other airport fades.
    */
    const visibleAirports = new Set([code]);

    destinationEntries.forEach(entry => {
        visibleAirports.add(entry.code);
    });

    Object.keys(airports).forEach(airportCode => {

        const markerEl =
            document.getElementById(`marker-${airportCode}`);

        if (!markerEl) return;

        if (!visibleAirports.has(airportCode)) {
            markerEl.classList.add("fade-out");

            if (airportMarkers[airportCode]) {
                airportMarkers[airportCode].closeTooltip();
            }
        }
    });

    /*
       Highlight only routes directly connected to the selected airport.
    */
    routeLayers.forEach(line => {

        const route = line.routeData;

        const connected =
            route.from === code ||
            route.to === code;

        line.setStyle({
            color: connected
                ? getComputedStyle(document.documentElement)
                    .getPropertyValue("--route-active").trim()
                : getComputedStyle(document.documentElement)
                    .getPropertyValue("--route").trim(),
            weight: connected ? 4 : 1,
            opacity: connected ? 1 : 0.10
        });
    });

    /*
       Top-left airport information panel.
       Large = airport name + country.
       Small = IATA / ICAO.
    */
    document.getElementById("airport-name").classList.remove("route-title-main");
    document.getElementById("airport-name").textContent =
        `${airport.name} · ${airport.country}`;

    document.getElementById("airport-code").textContent =
        `${code} / ${airport.icao}`;

    let panelHTML = "";

    const nordicaPriority = {
        OSL: 0,
        BGO: 1,
        SVG: 2
    };

    const destinationSort = (a, b) => {

        const aPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, a.code)
                ? nordicaPriority[a.code]
                : 99;

        const bPriority =
            Object.prototype.hasOwnProperty.call(nordicaPriority, b.code)
                ? nordicaPriority[b.code]
                : 99;

        if (aPriority !== bPriority) {
            return aPriority - bPriority;
        }

        return a.airport.city.localeCompare(b.airport.city);
    };

    const domestic = destinationEntries
        .filter(entry => entry.domestic && !entry.holidays)
        .sort(destinationSort);

    const international = destinationEntries
        .filter(entry => !entry.domestic && !entry.holidays)
        .sort(destinationSort);

    const holidays = destinationEntries
        .filter(entry => entry.holidays)
        .sort(destinationSort);

    /*
       Domestic destinations first.
    */
    if (domestic.length) {

        panelHTML += `
            <div class="section">
                Domestic · ${domestic.length}
            </div>
        `;

        domestic.forEach(entry => {

            panelHTML += `
                <div class="destination clickable" data-destination-code="${entry.code}">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.holidays
                                    ? "Holidays"
                                    : entry.mixed
                                        ? "Direct · Holidays"
                                        : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       International destinations second.
    */
    if (international.length) {

        panelHTML += `
            <div class="section">
                International · ${international.length}
            </div>
        `;

        international.forEach(entry => {

            panelHTML += `
                <div class="destination clickable" data-destination-code="${entry.code}">
                    <div>
                        <span class="destination-name">
                            ${entry.airport.name}
                        </span>
                        <span class="destination-code">
                            ${entry.code}
                        </span>
                    </div>

                    <div class="aircraft">
                        ${
                            ((code === "TOS" && entry.code === "TRD") ||
                             (code === "TRD" && entry.code === "TOS"))
                                ? "Via Bodø"
                                : entry.holidays
                                    ? "Holidays"
                                    : entry.mixed
                                        ? "Direct · Holidays"
                                        : "Direct"
                        }
                    </div>
                </div>
            `;
        });
    }

    /*
       Holidays destinations are listed separately below
       international destinations.
    */
    if (holidays.length) {

        panelHTML += `
            <div class="section">
                Holidays · ${holidays.length}

                </div>
            `;
        });
    }

    panelHTML += `

function getRouteSchedule(route) {
    if (!route) return null;
    if (typeof additionalSchedules === "undefined") return null;

    const direct = `${route.from}-${route.to}`;
    const reverse = `${route.to}-${route.from}`;

    return additionalSchedules[direct] ||
           additionalSchedules[reverse] ||
           null;
}

function routeHasFlightType(route, flightType) {
    const schedule = getRouteSchedule(route);
    if (!schedule) return false;

    return ["outbound", "inbound"].some(direction =>
        Object.values(schedule[direction] || {}).some(dayFlights =>
            Array.isArray(dayFlights) &&
            dayFlights.some(flight => flight && flight.flightType === flightType)
        )
    );
}

function routeHasHolidaysFlights(route) {
    return routeHasFlightType(route, "holidays") || route?.holidays === true;
}

function routeHasRegularFlights(route) {
    return routeHasFlightType(route, "regular") || (
        !route?.holidays &&
        !!getRouteSchedule(route)
    );
}

function getRouteCategory(route) {
    if (routeHasHolidaysFlights(route) && !routeHasRegularFlights(route)) {
        return "holidays";
    }

    const from = airports[route.from];
    const to = airports[route.to];

    return from && to && from.country === to.country
        ? "domestic"
        : "international";
}

function routePassesFilters(route) {
    const from = airports[route.from];
    const to = airports[route.to];

    const isInternational =
        from && to && from.country !== to.country;

    const isDomestic =
        from && to && from.country === to.country;

    const anyFilterActive =
        activeFilters.domestic ||
        activeFilters.international ||
        activeFilters.holidays;

    if (!anyFilterActive) return true;

    // Holidays is its own filter. A mixed route remains visible when the
    // route contains at least one Holidays flight.
    if (activeFilters.holidays) {
        return routeHasHolidaysFlights(route);
    }

    if (activeFilters.international) {
        return isInternational;
    }

    if (activeFilters.domestic) {
        return isDomestic;
    }

    return true;
}

function updateFilterVisibility() {
    const filters = document.getElementById("network-filters");
    if (!filters) return;

    // Filter buttons are hidden during a specific two-airport route view.
    if (selectedRouteKey) {
        filters.style.display = "none";
        return;
    }

    filters.style.display = "flex";

    // Determine which categories are actually represented in the current view.
    let visibleRoutes = routes;

    if (selectedAirportCode) {
        visibleRoutes = routes.filter(route =>
            route.from === selectedAirportCode ||
            route.to === selectedAirportCode
        );
    }

    const availableCategories = new Set();

    visibleRoutes.forEach(route => {
        availableCategories.add(getRouteCategory(route));

        if (routeHasHolidaysFlights(route)) {
            availableCategories.add("holidays");
        }

        const from = airports[route.from];
        const to = airports[route.to];

        if (from && to) {
            availableCategories.add(
                from.country === to.country ? "domestic" : "international"
            );
        }
    });

    document.querySelectorAll(".filter-button").forEach(button => {
        const category = button.dataset.filter;
        const available = availableCategories.has(category);

        button.style.display = available ? "" : "none";

        // If a currently active filter is no longer relevant in the new view,
        // turn it off.
        if (!available && activeFilters[category]) {
            activeFilters[category] = false;
            button.classList.remove("active");
        }
    });

    // If there are no active filters after the visibility update, the full
    // applicable network is displayed.
    applyNetworkFilters();
}

function getDisplayedRouteColor(route = null) {
    return getComputedStyle(document.documentElement)
        .getPropertyValue("--route").trim();
}

function applyNetworkFilters() {

    routeLayers.forEach(line => {

        const route = line.routeData;
        const categoryVisible = routePassesFilters(route);

        if (!categoryVisible) {
            line.setStyle({
                opacity: 0,
                weight: 0
            });
            return;
        }

        // Preserve the current selection state.
        if (selectedRouteKey) {

            const selected = 
                `${route.from}-${route.to}` === selectedRouteKey ||
                `${route.to}-${route.from}` === selectedRouteKey;

            line.setStyle({
                color: getDisplayedRouteColor(route),
                weight: selected ? 5 : 1,
                opacity: selected ? 1 : 0.08
            });

        } else if (selectedAirportCode) {

            const connected =
                route.from === selectedAirportCode ||
                route.to === selectedAirportCode;

            line.setStyle({
                color: getDisplayedRouteColor(route),
                weight: connected ? 2.5 : 1,
                opacity: connected ? 1 : 0.08
            });

        } else {

            line.setStyle({
                color: getDisplayedRouteColor(route),
                weight: 1.5,
                opacity: 0.45
            });
        }
    });

    // Hide airports that have no visible route under the active filter.
    const visibleByFilter = new Set();

    routes.forEach(route => {
        if (!routePassesFilters(route)) return;
        visibleByFilter.add(route.from);
        visibleByFilter.add(route.to);
    });

    Object.keys(airports).forEach(code => {

        const markerEl = document.getElementById(`marker-${code}`);
        if (!markerEl) return;

        if (!visibleByFilter.has(code)) {
            markerEl.classList.add("filter-hidden");
            if (airportMarkers[code]) {
                airportMarkers[code].closeTooltip();
            }
        } else {
            markerEl.classList.remove("filter-hidden");
        }
    });
}

document.querySelectorAll(".filter-button").forEach(button => {

    button.addEventListener("click", function(e) {

        e.stopPropagation();

        const filter = this.dataset.filter;

        // Only one category can be active at a time. Clicking the
        // currently active button turns filtering off and restores all routes.
        const wasActive = activeFilters[filter];

        Object.keys(activeFilters).forEach(key => {
            activeFilters[key] = false;
        });

        if (!wasActive) {
            activeFilters[filter] = true;
        }

        document.querySelectorAll(".filter-button").forEach(btn => {
            btn.classList.toggle("active", activeFilters[btn.dataset.filter]);
        });

        applyNetworkFilters();
        updateFilterVisibility();
    });
});

function resetMap() {

    selectedAirportCode = null;
    selectedRouteKey = null;
    updateFilterVisibility();

    document.getElementById("info-panel").style.display = "none";

    document.querySelectorAll(".airport-marker").forEach(el => {
        el.classList.remove("selected");
        el.classList.remove("fade-out");
    });

    routeLayers.forEach(line => {
        line.setStyle({
            color: getComputedStyle(document.documentElement)
                .getPropertyValue("--route").trim(),
            weight: 1.5,
            opacity: 0.45
        });
    });

    applyNetworkFilters();

    document.getElementById("airport-name").classList.remove("route-title-main");
    const airportDisplayName = code === "LPA" ? "Gran Canaria" : airport.name;
    document.getElementById("airport-name").textContent = `${airportDisplayName} ${code}`;

    document.getElementById("airport-code").textContent =
        "OSL / ENGM · Primary Hub";

    document.getElementById("panel-content").innerHTML = `
        <div class="empty-state">
            Hover over an airport to see its name.<br><br>
            Click an airport to see all destinations served from that airport.
        </div>
    `;
}

function fitNetwork() {

    const coordinates =
        Object.values(airports).map(airport => [
            airport.lat,
            airport.lng
        ]);

    if (!coordinates.length) return;

    const bounds = L.latLngBounds(coordinates);

    map.fitBounds(bounds, {
        padding: [60, 60],
        maxZoom: 5
    });
}

function scheduleRouteKey(a, b) {
    const direct = `${a}-${b}`;
    const reverse = `${b}-${a}`;

    if (tosSchedules[direct]) return direct;
    if (tosSchedules[reverse]) return reverse;

    if (typeof tosThroughLegSchedules !== "undefined") {
        if (tosThroughLegSchedules[direct]) return direct;
        if (tosThroughLegSchedules[reverse]) return reverse;
    }

    if (additionalSchedules[direct]) return direct;
    if (additionalSchedules[reverse]) return reverse;

    if (bgoSchedules[direct]) return direct;
    if (bgoSchedules[reverse]) return reverse;

    return direct;
}

// Calendar bounds are calculated from the user's current local date.
// The current month is always the first available month, and 12 future
// months are available after it (13 calendar months inclusive).
function getScheduleToday() {
    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Oslo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    const values = {};
    parts.forEach(part => {
        if (part.type !== "literal") values[part.type] = part.value;
    });

    return {
        year: Number(values.year),
        month: Number(values.month) - 1,
        day: Number(values.day)
    };
}

function getScheduleMinDate() {
    const today = getScheduleToday();
    return { year: today.year, month: today.month };
}

function getScheduleMaxDate() {
    const min = getScheduleMinDate();
    const date = new Date(min.year, min.month + 12, 1);
    return { year: date.getFullYear(), month: date.getMonth() };
}

let scheduleCalendarYear = getScheduleMinDate().year;
let scheduleCalendarMonth = getScheduleMinDate().month;

const scheduleMonthNames = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
];

const scheduleWeekdayNames = [
    "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"
];


function isScheduleActiveForDate(schedule, date) {
    if (!schedule || schedule.startWeek == null || schedule.endWeek == null) return true;

    const d = new Date(date);
    const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = utc.getUTCDay() || 7;
    utc.setUTCDate(utc.getUTCDate() + 4 - day);

    const isoYear = utc.getUTCFullYear();
    const yearStart = new Date(Date.UTC(isoYear, 0, 1));
    const isoWeek = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);

    const startWeek = Number(schedule.startWeek);
    const endWeek = Number(schedule.endWeek);

    if (!Number.isFinite(startWeek) || !Number.isFinite(endWeek)) return true;

    // Normal range, e.g. week 14 through week 42.
    if (startWeek <= endWeek) {
        return isoWeek >= startWeek && isoWeek <= endWeek;
    }

    // Range crossing New Year, e.g. week 40 through week 15.
    return isoWeek >= startWeek || isoWeek <= endWeek;
}

function getScheduleDirectionData(direction) {
    /*
       The schedule tabs are always relative to the route currently shown
       in the route pop-up:
         outbound = pop-up origin -> pop-up destination
         inbound  = pop-up destination -> pop-up origin

       BOO services are stored in two timetable objects:
         TRD-BOO: outbound TRD->BOO, inbound BOO->TRD
         TOS-BOO: outbound TOS->BOO, inbound BOO->TOS

       Handle these four directions explicitly so the two calendar tabs
       can never accidentally use the same timetable.
    */

    if (scheduleRouteFrom === "TRD" && scheduleRouteTo === "BOO") {
        const s = tosThroughLegSchedules["TRD-BOO"];
        return direction === "outbound" ? s.outbound : s.inbound;
    }

    if (scheduleRouteFrom === "BOO" && scheduleRouteTo === "TRD") {
        const s = tosThroughLegSchedules["TRD-BOO"];
        return direction === "outbound" ? s.inbound : s.outbound;
    }

    if (scheduleRouteFrom === "TOS" && scheduleRouteTo === "BOO") {
        const s = tosThroughLegSchedules["TOS-BOO"];
        return direction === "outbound" ? s.outbound : s.inbound;
    }

    if (scheduleRouteFrom === "BOO" && scheduleRouteTo === "TOS") {
        const s = tosThroughLegSchedules["TOS-BOO"];
        return direction === "outbound" ? s.inbound : s.outbound;
    }

    // TOS ↔ TRD through service via Bodø.
    if ((scheduleRouteFrom === "TOS" && scheduleRouteTo === "TRD") ||
        (scheduleRouteFrom === "TRD" && scheduleRouteTo === "TOS")) {
        const s = tosThroughServiceSchedule["TOS-TRD"];

        if (scheduleRouteFrom === "TOS") {
            return direction === "outbound" ? s.outbound : s.inbound;
        }

        return direction === "outbound" ? s.inbound : s.outbound;
    }

    // All other TOS schedules use the existing route timetable.
    const key = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);
    const schedule =
        tosSchedules[key] ||
        additionalSchedules[key] ||
        bgoSchedules[key];
    if (!schedule) return null;
const storedOrigin = key.split("-")[0];
    const sameDirection = scheduleRouteFrom === storedOrigin;

    return direction === "outbound"
        ? (sameDirection ? schedule.outbound : schedule.inbound)
        : (sameDirection ? schedule.inbound : schedule.outbound);
}

function getFlightsForDate(direction, year, month, day) {
    const date = new Date(year, month, day);
    const data = getScheduleDirectionData(direction);
    if (!data) return [];

    const routeKey = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);

    /*
       Flight-level operating weeks are the authoritative source for seasonal
       schedules. This allows a route to contain both year-round and seasonal
       flights, such as OSL-LPA.

       A small legacy fallback is retained only for the older GOT-TFS/TFS-GOT
       timetable, which does not yet carry Start/End Week fields in the source
       document. Newer timetable rows should always use their own flight-level
       limits.
    */
    const hasFlightLevelWeekData = Object.values(data).some(dayFlights =>
        Array.isArray(dayFlights) && dayFlights.some(flight =>
            flight && (flight.startWeek != null || flight.endWeek != null)
        )
    );

    const legacyWeekRanges = {
        "GOT-TFS": [40, 15],
        "TFS-GOT": [40, 15]
    };

    if (!hasFlightLevelWeekData && legacyWeekRanges[routeKey]) {
        const [startWeek, endWeek] = legacyWeekRanges[routeKey];
        if (!isScheduleActiveForDate({ startWeek, endWeek }, date)) {
            return [];
        }
    }

    const weekdayIndex = (date.getDay() + 6) % 7;
    const weekday = scheduleWeekdayNames[weekdayIndex];

    return (data[weekday] || []).filter(flight =>
        isScheduleActiveForDate(flight, date)
    );
}

function formatScheduleAircraft(aircraft) {
    const value = (aircraft || "").trim().toUpperCase();

    if (value === "CRJ7" || value === "CR7") return "Bombardier CRJ7";
    if (value === "CRJ9") return "Bombardier CRJ9";
    if (value === "B38M") return "Boeing 737-8 MAX";

    return aircraft || "";
}

function splitFlightDetails(flight) {
    const raw = (flight || "").trim();

    // Flight data uses both "/" and "|" as separators in the schedule data.
    // Accept either so every flight number/equipment pair displays correctly.
    const parts = raw.split(/\s*[\/|]\s*/);

    return {
        number: parts[0] || "",
        aircraft: formatScheduleAircraft(parts[1] || "")
    };
}

function getScheduleMonthIndex(year, month) {
    const min = getScheduleMinDate();
    return (year - min.year) * 12 + (month - min.month);
}

function updateScheduleMonthButtons() {
    if (isSeasonalWinterRoute()) {
        const months = getSeasonalWinterCalendarMonths();
        const idx = months.findIndex(m =>
            m.year === scheduleCalendarYear && m.month === scheduleCalendarMonth
        );
        const prev = document.querySelector(".schedule-prev-month");
        const next = document.querySelector(".schedule-next-month");
        if (prev) prev.style.visibility = idx > 0 ? "visible" : "hidden";
        if (next) next.style.visibility = idx >= 0 && idx < months.length - 1 ? "visible" : "hidden";
        return;
    }

    const max = getScheduleMaxDate();

    const currentIndex =
        getScheduleMonthIndex(scheduleCalendarYear, scheduleCalendarMonth);

    const maxIndex = getScheduleMonthIndex(max.year, max.month);

    const atFirstMonth = currentIndex <= 0;
    // Two months are displayed, so the first month cannot be the final
    // available month.
    const atLastMonth = currentIndex >= maxIndex - 1;

    document.querySelectorAll(".schedule-prev-month").forEach(button => {
        button.classList.toggle("hidden", atFirstMonth);
    });

    document.querySelectorAll(".schedule-next-month").forEach(button => {
        button.classList.toggle("hidden", atLastMonth);
    });
}


function isSeasonalWinterRoute() {
    const key = scheduleRouteKey(scheduleRouteFrom, scheduleRouteTo);

        (r.from === scheduleRouteFrom && r.to === scheduleRouteTo) ||
        (r.from === scheduleRouteTo && r.to === scheduleRouteFrom)

    // than having a single seasonal operating window.

        key === "OSL-LPA" || key === "LPA-OSL" ||
        key === "OSL-LCA" || key === "LCA-OSL" ||

    const hasYearRoundFlight = scheduleDirections.some(data =>
        Object.values(data).some(dayFlights =>
