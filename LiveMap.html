<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nordica — Live Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
:root {
    --water: #1d2f4b;
    --land: #263e65;
    --land-border: #4671b8;
    --navy: #1d2f4b;
    --route: #4671b8;
    --route-active: #4671b8;
    --holidays: #ff8a05;
    --airport: #f4f7fa;
    --hub: #ffffff;
    --text: #f4f7fa;
    --muted: #9eafc0;
    --panel: rgba(8, 22, 39, 0.96);
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--water);
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: calc(100% - 76px);
    min-height: 0;
    background: #1d2f4b;
}

/* Airport information is shown only in the top-left panel. */

/* Information panel */
#info-panel {
    display: none;
    position: absolute;
    z-index: 1000;
    top: 96px;
    left: 20px;
    width: 390px;
    max-width: calc(100vw - 40px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.40);
    backdrop-filter: blur(8px);
    overflow: hidden;
}

#panel-header {
    padding: 18px 20px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.eyebrow {
    color: #4671b8;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

#airport-name {
    margin: 0;
    font-size: 24px;
}

#airport-code {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

#airport-code strong {
    color: var(--text);
    font-weight: 700;
}

#panel-content {
    padding: 16px 20px 20px;
    max-height: 55vh;
    overflow-y: auto;
}

.empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .8px;
    margin-bottom: 5px;
}


.airport-role {
    margin-top: 8px;
}

.airport-tabs {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    margin-top: 14px;
    height: 42px;
    padding: 0;
    border-bottom: 1px solid 

rgba(255,255,255,.10);
}

.airport-tab {
    position: relative;
    flex: 1 1 33.333%;
    height: 42px;
    min-width: 0;
    padding: 0 8px;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 9px 9px 0 0;
    background: transparent;
    color: rgba(255,255,255,.55);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.airport-tab:hover {
    color: #fff;
    background: rgba(255,255,255,.045);
}

.airport-tab.active {
    border-color: rgba(255,255,255,.10);
    background: #263e65;
    color: #fff;
}

.airport-tab.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    background: #4671b8;
    border-radius: 2px;
}

.airport-schedule-title {
    margin: 0 0 12px;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
}

.airport-schedule-list {
    width: 100%;
}

.airport-schedule-flight {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.airport-schedule-flight:last-child {
    border-bottom: none;
}

.airport-schedule-iata {
    margin-left: 5px;
    color: rgba(255,255,255,.66);
    font-size: 13px;
    font-weight: 600;
}

.airport-schedule-route {
    color: var(--text);
    font-size: 16px;
    line-height: 1.05;
}

.airport-schedule-time {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    justify-self: end;
}

.airport-schedule-secondary-time {
    margin-top: 0;
    color: rgba(255,255,255,.66);
    font-size: 11px !important;
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    text-align: right;
}


.airport-schedule-meta {
    margin-top: 3px;
    color: rgba(255,255,255,.60);
    font-size: 11px;
    line-height: 1.35;
}

.airport-schedule-number {
    color: rgba(255,255,255,.72);
    font-weight: 700;
}

.airport-schedule-empty {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
}

@media (max-width: 700px) {
    #map { height: calc(100% - 68px); }

    .airport-tab {
        font-size: 11px;
        padding: 0 4px;
    }
}

.section {
    margin-top: 18px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.destination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.destination:last-child {
    border-bottom: none;
}

.destination-code {
    font-weight: 700;
    font-size: 14px;
}

.destination-name {
    color: var(--text);
    font-size: 12px;
    margin-right: 6px;
}

.route-info {
    color: #4671b8;
    font-size: 11px;
}

#reset {
    width: 100%;
    margin-top: 17px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: #263e65;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

#reset:hover {
    background: #4671b8;
}

/* Airport markers */
.airport-marker {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--airport);
    border: 2px solid #263e65;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
    box-sizing: border-box;
}

.airport-marker.filter-hidden {
    opacity: 0 !important;
    pointer-events: none !important;
}

.airport-marker.hub {
    width: 11px;
    height: 11px;
    border: 2px solid #263e65;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.20),
                0 2px 7px rgba(0,0,0,0.5);
}

.airport-marker.selected {
    opacity: 1;
}

.airport-marker.fade-out {
    opacity: 0.18;
}

/* Airport labels */
.airport-label {
    color: white;
    background: transparent;
    border: none;
    box-shadow: none;
    font-size: 11px;
    font-weight: 700;
    text-shadow:
        0 1px 3px #1d2f4b,
        1px 0 3px #1d2f4b,
        -1px 0 3px #1d2f4b;
}

.airport-label::before {
    display: none;
}

/* Hover popup */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #1d2f4b;
    color: white;
}

.leaflet-popup-content {
    margin: 12px 14px;
}

.popup-title {
    font-size: 16px;
    font-weight: 700;
}

.popup-code {
    color: #4671b8;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 0;
}

.popup-info {
    color: #9eafc0;
    font-size: 12px;
    line-height: 1.45;
    margin-top: 8px;
}

.leaflet-control-attribution {
    background: rgba(7,20,38,.80) !important;
    color: #8fa2b6 !important;
}

.leaflet-control-attribution a {
    color: #4671b8 !important;
}

@media (max-width: 600px) {
    #info-panel {
        top: 10px;
        left: 10px;
        width: 285px;
    }
}

.route-detail {
    padding-top: 2px;
}

.route-detail-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--muted);
    font-size: 12px;
}

.route-detail-row strong {
    color: var(--text);
    font-size: 15px;
    text-align: right;
    line-height: 1.35;
    max-width: 65%;
}

.route-detail-row.seasonal-row strong {
    color: var(--text);
}


.destination.clickable {
    cursor: pointer;
    margin-left: -8px;
    margin-right: -8px;
    padding-left: 8px;
    padding-right: 8px;
    border-radius: 6px;
}
.destination.clickable:hover {
    background: rgba(255,255,255,0.04);
}


#panel-header {
    position: relative;
}

#panel-switch {
    display: none;
    position: absolute;
    top: 76px;
    right: 9px;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    color: rgba(255,255,255,.78);
    font-size: 25px;
    line-height: 32px;
    cursor: pointer;
    z-index: 20;
}
#info-panel.route-no-season:not(.route-starts-april) #panel-switch {
    top: 52px;
}
#info-panel.route-starts-april #panel-switch {
    top: 52px;
}
#info-panel:not(.route-no-season) #panel-switch {
    top: 52px;
}
#panel-switch:hover {
    background: transparent;
    color: #fff;
}

#panel-close {
    position: absolute;
    top: 10px;
    right: 11px;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: rgba(244,247,250,0.52);
    font-size: 22px;
    font-weight: 300;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    border-radius: 50%;
    transition: color 0.15s ease, background 0.15s ease;
}

#panel-close:hover {
    color: rgba(244,247,250,0.90);
    background: rgba(255,255,255,0.07);
}

#panel-close:focus-visible {
    outline: 1px solid rgba(108,166,214,0.75);
    outline-offset: 2px;
}


.operator-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.operator-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.operator-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.operator-info .operator-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: 50%;
    right: auto;
    transform: translate(-50%, 3px);
    width: 250px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.operator-info .operator-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.operator-info:hover .operator-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}


#network-filters {
    position: absolute;
    z-index: 1100;
    top: 94px;
    right: 18px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    width: 154px;
}

.filter-title {
    margin: 0 0 2px 2px;
    color: rgba(255,255,255,0.52);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.9px;
    text-transform: uppercase;
}

.filter-button {
    appearance: none;
    width: 100%;
    padding: 7px 11px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: rgba(10,18,28,0.58);
    color: rgba(255,255,255,0.70);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.25px;
    text-align: left;
    cursor: pointer;
    box-shadow: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}

.filter-button:hover {
    background: rgba(20,32,45,0.72);
    border-color: rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.94);
}

.filter-button:active {
    background: rgba(24,39,54,0.78);
}

.filter-button.active {
    background: rgba(54,105,145,0.48);
    border-color: rgba(139,202,242,0.52);
    color: #fff;
}

.filter-button.active:hover {
    background: rgba(61,116,158,0.56);
    border-color: rgba(158,216,250,0.64);
}

.filter-button:focus-visible {
    outline: none;
    border-color: rgba(151,216,255,0.72);
    box-shadow: 0 0 0 2px rgba(90,170,225,0.14);
}

@media (max-width: 600px) {
    #network-filters {
        top: 78px;
        right: 10px;
        width: 142px;
        gap: 5px;
    }

    .filter-title {
        font-size: 9px;
    }

    .filter-button {
        padding: 7px 9px;
        font-size: 10px;
    }
}


.frequency-value {
    white-space: nowrap;
    font-size: 13px !important;
}

.flight-type-info {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 7px;
    border: 1px solid rgba(244,247,250,0.45);
    border-radius: 50%;
    color: rgba(244,247,250,0.65);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    cursor: help;
    vertical-align: middle;
}

.flight-type-info:hover {
    color: rgba(244,247,250,0.95);
    border-color: rgba(244,247,250,0.75);
}

.flight-type-info .flight-type-tooltip {
    position: absolute;
    bottom: calc(100% + 9px);
    left: auto;
    right: -6px;
    width: 270px;
    padding: 2px 4px;
    border-radius: 8px;
    background: rgba(8,22,39,0.98);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
    color: #dbe5ee;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 3px);
    transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
    pointer-events: none;
    z-index: 2000;
}

.flight-type-info .flight-type-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    right: 2px;
    left: auto;
    border: 5px solid transparent;
    border-top-color: rgba(8,22,39,0.98);
}

.flight-type-info:hover .flight-type-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translate(0, 0);
}


.airport-marker.special-base {
    position: relative;
}

.airport-marker.special-base::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #d62828;
}


.via-bodo {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
}

/* Route Schedule */
/* Embedded route calendar */

.holidays-operator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
}

.holidays-operator span {
    color: #ffffff;
    opacity: 1;
}

.holidays-operator img {
    display: block;
    width: 76px;
    height: auto;
    max-height: 28px;
    object-fit: contain;
}

.route-popup-comments {
    margin-top: 8px;
    color: rgba(255,255,255,.52);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.35;
    text-align: center;
}
.route-starts-april-message {
    min-height: 280px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 70px 20px;
    color: rgba(255,255,255,.78);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    text-align: center;
}
.route-calendar.schedule-transition-out {
    opacity: .32;
    transform: translateX(-7px);
    transition: opacity .18s ease, transform .18s ease;
}
.route-calendar.schedule-transition-in {
    opacity: 0;
    transform: translateX(7px);
    transition: opacity .26s ease, transform .26s ease;
}
#airport-name.route-title-main {
    font-size: 24px !important;
    line-height: 1.2 !important;
    font-weight: 600 !important;
}

#airport-name.route-title-main .route-title-subtitle {
    margin-top: 3px !important;
    color: rgba(255,255,255,.48) !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    line-height: 1.3 !important;
    text-align: left !important;
}

#airport-name.route-title-main .route-via-label {
    margin-top: 4px !important;
    color: rgba(255,255,255,.72) !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    line-height: 1.3 !important;
    text-align: left !important;
}

.route-season-subtitle {
    margin-top: 5px;
    font-size: 12px;
    font-style: italic;
    color: inherit;
    opacity: 0.9;
    position: relative;
    top: -16px;
}


.route-calendar {
    width: 100%;
    box-sizing: border-box;
    margin-top: -4px;
    padding-top: 2px;
    position: relative;
}

.route-calendar-loading {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 4px;
    color: rgba(255,255,255,.52);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-3px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s ease;
}

.route-calendar-loading.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.route-calendar-spinner {
    width: 11px;
    height: 11px;
    border: 2px solid rgba(255,255,255,.18);
    border-top-color: rgba(112,194,241,.95);
    border-radius: 50%;
    animation: routeCalendarSpin .65s linear infinite;
}

@keyframes routeCalendarSpin {
    to { transform: rotate(360deg); }
}

.route-calendar-header {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.route-calendar-month {
    margin: 0;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
}

.route-calendar-arrow {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px;
    background: rgba(255,255,255,.045);
    color: rgba(255,255,255,.82);
    font-size: 20px;
    line-height: 28px;
    cursor: pointer;
    transition: .16s ease;
}

.route-calendar-arrow:hover {
    background: rgba(92,158,204,.20);
    border-color: rgba(130,205,250,.42);
    color: #fff;
}

.route-calendar-arrow.hidden {
    visibility: hidden;
    pointer-events: none;
}

.route-calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: 28px repeat(6, 42px);
    border-top: 1px solid rgba(255,255,255,.09);
    border-left: 1px solid rgba(255,255,255,.09);
    border-radius: 8px;
    overflow: hidden;
}

.route-calendar-weekday {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15,20,27,.72);
    color: rgba(255,255,255,.54);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .25px;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
}

.route-calendar-day {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 7px 8px;
    border: 0;
    border-right: 1px solid rgba(255,255,255,.09);
    border-bottom: 1px solid rgba(255,255,255,.09);
    background: rgba(29,37,48,.72);
    color: rgba(255,255,255,.82);
    font-family: Arial, Helvetica, sans-serif;

<style id="nordica-network-frame-v141">
/*
  V1.0.141
  The large navy strip at the bottom was not a frame; it was the unused
  76px of page height created by #map's calc(100% - 76px).
  Let the map occupy the entire viewport. The fixed header naturally covers
  its top portion, while the frame is drawn over the map itself.
*/
#map {
    height: 100% !important;
    width: 100% !important;
    border: 0 !important;
    box-sizing: border-box !important;
    position: relative !important;
}

/* Thin, visible side + bottom frame, above all Leaflet layers. */
#map::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    box-sizing: border-box;
    border-left: 3px solid rgba(255,255,255,0.12);
    border-right: 3px solid rgba(255,255,255,0.12);
    border-bottom: 3px solid rgba(255,255,255,0.12);
}

/* The header is 68px on mobile, but the map still fills the viewport. */
@media (max-width: 700px) {
    #map {
        height: 100% !important;

        border-left-width: 3px;
        border-right-width: 3px;

}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatTime(value) {
    if (!value) return "—";

    // PostgreSQL time without time zone arrives as HH:MM:SS.
    if (typeof value === "string") {
        const timeOnly = value.match(/^(\d{2}:\d{2})/);
        if (timeOnly) return timeOnly[1];
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";

    return date.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });
}

function formatAltitude(value) {
    if (value === null || value === undefined || !Number.isFinite(Number(value))) {
        return "—";
    }

    return Math.round(Number(value)).toLocaleString("en-US") + " ft";
}

function formatSpeed(value) {
    if (value === null || value === undefined || !Number.isFinite(Number(value))) {
        return "—";
    }

    return Math.round(Number(value)) + " kt";
}

function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calculateEta(flight) {
    if (!flight.latitude || !flight.longitude ||
        !flight.arrival_latitude || !flight.arrival_longitude) {
        return null;
    }

    const speed = Number(flight.true_airspeed_kt) || Number(flight.ground_speed_kt);
    if (!speed || speed < 30) return null;

    const distanceKm = haversineKm(
        Number(flight.latitude),
        Number(flight.longitude),
        Number(flight.arrival_latitude),
        Number(flight.arrival_longitude)
    );

    const hours = distanceKm / (speed * 1.852);
    return new Date(Date.now() + hours * 3600000);
}

function formatEta(flight) {
    const eta = calculateEta(flight);
    return eta ? formatTime(eta.toISOString()) : "—";
}

function bearingDegrees(lat1, lon1, lat2, lon2) {
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const lambda = (lon2 - lon1) * Math.PI / 180;

    const y = Math.sin(lambda) * Math.cos(phi2);
    const x =
        Math.cos(phi1) * Math.sin(phi2) -
        Math.sin(phi1) * Math.cos(phi2) * Math.cos(lambda);

    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function airportDisplayName(name, city, iata) {
    return name || (city ? `${city} Airport` : iata || "Airport");
}

function setFirstMovementAtd(sessionId, telemetryPoints) {
    if (!Array.isArray(telemetryPoints) || telemetryPoints.length < 2) return;

    for (let i = 1; i < telemetryPoints.length; i++) {
        const previous = telemetryPoints[i - 1];
        const current = telemetryPoints[i];

        const previousLat = Number(previous.latitude);
        const previousLng = Number(previous.longitude);
        const currentLat = Number(current.latitude);
        const currentLng = Number(current.longitude);

        if (![previousLat, previousLng, currentLat, currentLng].every(Number.isFinite)) continue;

        const movementKm = haversineKm(previousLat, previousLng, currentLat, currentLng);
        if (movementKm > 0.01 && current.recorded_at) {
            firstMovementTimes.set(sessionId, current.recorded_at);
            return;
        }
    }
}

function setPanel(flight) {
    if (!flight) return;

    document.getElementById("live-route").textContent =
        `${airportDisplayName(flight.departure_name, flight.departure_city, flight.departure_iata)} → ${airportDisplayName(flight.arrival_name, flight.arrival_city, flight.arrival_iata)}`;

    document.getElementById("live-route-codes").textContent =
        `${flight.departure_iata || "—"} – ${flight.arrival_iata || "—"}`;

    document.getElementById("live-flight-number").textContent =
        `${flight.flight_number || "—"} / ${flight.callsign || "—"}`;

    document.getElementById("live-aircraft").textContent =
        flight.aircraft_type || "—";

    document.getElementById("live-registration").textContent =
        flight.aircraft_registration || "—";

    document.getElementById("live-altitude").textContent =
        formatAltitude(flight.altitude_ft);

    document.getElementById("live-speed").textContent =
        formatSpeed(flight.true_airspeed_kt || flight.ground_speed_kt);

    document.getElementById("live-schedule").textContent =
        `${formatTime(flight.scheduled_departure)} / ${formatTime(flight.scheduled_arrival)}`;

    document.getElementById("live-atd").textContent =
        formatTime(firstMovementTimes.get(flight.session_id));

    document.getElementById("live-eta").textContent =
        formatEta(flight);

    document.getElementById("live-status").textContent =
        flight.acars_state || "LIVE";

    panel.classList.add("visible");
}

function clearSelection() {
    selectedSessionId = null;
    panel.classList.remove("visible");

    routeLines.forEach(line => map.removeLayer(line));
    destinationLines.forEach(line => map.removeLayer(line));
    destinationMarkers.forEach(marker => map.removeLayer(marker));
    originMarkers.forEach(marker => map.removeLayer(marker));

    routeLines.clear();
    destinationLines.clear();
    destinationMarkers.clear();
    originMarkers.clear();
}

function selectFlight(sessionId) {
    if (!liveFlights.has(sessionId)) return;

    selectedSessionId = sessionId;
    const flight = liveFlights.get(sessionId);

    setPanel(flight);
    drawSelectedFlight(flight);
}

function drawSelectedFlight(flight) {
    routeLines.forEach(line => map.removeLayer(line));
    destinationLines.forEach(line => map.removeLayer(line));
    destinationMarkers.forEach(marker => map.removeLayer(marker));
    originMarkers.forEach(marker => map.removeLayer(marker));

    routeLines.clear();
    destinationLines.clear();
    destinationMarkers.clear();
    originMarkers.clear();

    if (!flight) return;

    /*
       The detailed flown route is retrieved from the telemetry RPC.
       It is redrawn every refresh while this flight is selected.
    */
    loadFlightTelemetry(flight.session_id);

    if (Number.isFinite(Number(flight.latitude)) &&
        Number.isFinite(Number(flight.longitude)) &&
        Number.isFinite(Number(flight.departure_latitude)) &&
        Number.isFinite(Number(flight.departure_longitude)) &&
        Number.isFinite(Number(flight.arrival_latitude)) &&
        Number.isFinite(Number(flight.arrival_longitude))) {

        const destinationLine = L.polyline(
            [
                [Number(flight.latitude), Number(flight.longitude)],
                [Number(flight.arrival_latitude), Number(flight.arrival_longitude)]
            ],
            {
                className: "live-destination-line",
                interactive: false
            }
        ).addTo(map);

        destinationLines.set(
            flight.session_id,
            destinationLine
        );

        const originMarker = L.marker(
            [Number(flight.departure_latitude), Number(flight.departure_longitude)],
            {
                icon: L.divIcon({
                    className: "",
                    html: '<div class="live-destination-marker"></div>',
                    iconSize: [10, 10],
                    iconAnchor: [5, 5]
                }),
                interactive: false
            }
        ).addTo(map);

        originMarkers.set(flight.session_id, originMarker);

        const destinationMarker = L.marker(
            [Number(flight.arrival_latitude), Number(flight.arrival_longitude)],
            {
                icon: L.divIcon({
                    className: "",
                    html: '<div class="live-destination-marker"></div>',
                    iconSize: [10, 10],
                    iconAnchor: [5, 5]
                }),
                interactive: false
            }
        ).addTo(map);

        destinationMarkers.set(
            flight.session_id,
            destinationMarker
        );
    }
}

async function loadFlightTelemetry(sessionId) {
    if (selectedSessionId !== sessionId) return;

    try {
        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/acars_get_live_telemetry`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                },
                body: JSON.stringify({
                    p_session_id: sessionId
                })
            }
        );

        if (!response.ok) {
            console.warn(
                "Live telemetry RPC returned",
                response.status,
                await response.text()
            );
            return;
        }

        const points = await response.json();

        if (!Array.isArray(points) || !points.length) return;

        setFirstMovementAtd(sessionId, points);

        if (selectedSessionId === sessionId) {
            const selectedFlight = liveFlights.get(sessionId);
            if (selectedFlight) setPanel(selectedFlight);
        }
        if (selectedSessionId !== sessionId) return;

        const latLngs = points
            .filter(p =>
                Number.isFinite(Number(p.latitude)) &&
                Number.isFinite(Number(p.longitude))
            )
            .map(p => [
                Number(p.latitude),
                Number(p.longitude)
            ]);

        // Always make the live route end at the exact same position as
        // the aircraft marker. The live-flight RPC and telemetry RPC can
        // complete a fraction of a second apart, so the newest telemetry
        // point can otherwise be slightly behind the marker position.
        const liveFlight = liveFlights.get(sessionId);
        if (liveFlight &&
            Number.isFinite(Number(liveFlight.latitude)) &&
            Number.isFinite(Number(liveFlight.longitude))) {
            const currentPosition = [
                Number(liveFlight.latitude),
                Number(liveFlight.longitude)
            ];

            if (!latLngs.length ||
                latLngs[latLngs.length - 1][0] !== currentPosition[0] ||
                latLngs[latLngs.length - 1][1] !== currentPosition[1]) {
                latLngs.push(currentPosition);
            }
        }

        if (latLngs.length < 2) return;

        const line = L.polyline(
            latLngs,
            {
                className: "live-route-line",
                interactive: false
            }
        ).addTo(map);

        routeLines.set(sessionId, line);
    } catch (error) {
        console.error("Could not load live telemetry:", error);
    }
}

function updatePlaneMarker(flight) {
    const sessionId = flight.session_id;

    if (!Number.isFinite(Number(flight.latitude)) ||
        !Number.isFinite(Number(flight.longitude))) {
        return;
    }

    const lat = Number(flight.latitude);
    const lng = Number(flight.longitude);

    let heading = 0;
    const previous = previousPositions.get(sessionId);

    if (previous) {
        const distance = haversineKm(
            previous.lat,
            previous.lng,
            lat,
            lng
        );

        if (distance > 0.001) {
            heading = bearingDegrees(
                previous.lat,
                previous.lng,
                lat,
                lng
            );
        }
    } else if (
        Number.isFinite(Number(flight.departure_latitude)) &&
        Number.isFinite(Number(flight.departure_longitude)) &&
        Number.isFinite(Number(flight.arrival_latitude)) &&
        Number.isFinite(Number(flight.arrival_longitude))
    ) {
        heading = bearingDegrees(
            Number(flight.departure_latitude),
            Number(flight.departure_longitude),
            Number(flight.arrival_latitude),
            Number(flight.arrival_longitude)
        );
    }

    previousPositions.set(sessionId, { lat, lng });

    if (!planeMarkers.has(sessionId)) {
        const marker = L.marker(
            [lat, lng],
            {
                icon: createPlaneIcon(heading),
                zIndexOffset: 1000
            }
        );

        marker.on("click", function(e) {
            L.DomEvent.stopPropagation(e);
            selectFlight(sessionId);
        });

        marker.addTo(map);
        planeMarkers.set(sessionId, marker);
    } else {
        const marker = planeMarkers.get(sessionId);
        marker.setLatLng([lat, lng]);
        marker.setIcon(createPlaneIcon(heading));
    }

    if (selectedSessionId === sessionId) {
        setPanel(flight);

        const destinationLine = destinationLines.get(sessionId);
        if (destinationLine) {
            destinationLine.setLatLngs([
                [lat, lng],
                [
                    Number(flight.arrival_latitude),
                    Number(flight.arrival_longitude)
                ]
            ]);
        }

        const destinationMarker = destinationMarkers.get(sessionId);
        if (destinationMarker) {
            destinationMarker.setLatLng([
                Number(flight.arrival_latitude),
                Number(flight.arrival_longitude)
            ]);
        }
    }
}

function removeFlight(sessionId) {
    const marker = planeMarkers.get(sessionId);
    if (marker) {
        map.removeLayer(marker);
        planeMarkers.delete(sessionId);
    }

    previousPositions.delete(sessionId);
    firstMovementTimes.delete(sessionId);

    const route = routeLines.get(sessionId);
    if (route) {
        map.removeLayer(route);
        routeLines.delete(sessionId);
    }

    const destinationLine = destinationLines.get(sessionId);
    if (destinationLine) {
        map.removeLayer(destinationLine);
        destinationLines.delete(sessionId);
    }

    const destinationMarker = destinationMarkers.get(sessionId);
    if (destinationMarker) {
        map.removeLayer(destinationMarker);
        destinationMarkers.delete(sessionId);
    }

    const originMarker = originMarkers.get(sessionId);
    if (originMarker) {
        map.removeLayer(originMarker);
        originMarkers.delete(sessionId);
    }

    if (selectedSessionId === sessionId) {
        clearSelection();
    }
}

async function loadLiveFlights() {
    try {
        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/acars_get_live_flights`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                },
                body: JSON.stringify({})
            }
        );

        if (!response.ok) {
            console.error(
                "Live flights RPC returned",
                response.status,
                await response.text()
            );
            return;
        }

        const rows = await response.json();

        if (!Array.isArray(rows)) return;

        const currentIds = new Set();

        rows.forEach(flight => {
            const sessionId = Number(flight.session_id);
            if (!Number.isFinite(sessionId)) return;

            currentIds.add(sessionId);
            liveFlights.set(sessionId, flight);
            updatePlaneMarker(flight);
        });

        Array.from(liveFlights.keys()).forEach(sessionId => {
            if (!currentIds.has(sessionId)) {
                liveFlights.delete(sessionId);
                removeFlight(sessionId);
            }
        });

        countLabel.textContent =
            `${rows.length} live flight${rows.length === 1 ? "" : "s"}`;

        if (selectedSessionId !== null) {
            const selected = liveFlights.get(selectedSessionId);

            if (selected) {
                setPanel(selected);
                drawSelectedFlight(selected);
            }
        }
    } catch (error) {
        console.error("Could not load live flights:", error);
    }
}

map.on("click", function() {
    clearSelection();
});

loadLiveFlights();
setInterval(loadLiveFlights, 5000);

</script>
